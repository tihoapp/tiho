<title>ms-app v4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ms-app v4 test build. Layout: one phone column; scroll area, then toast, quick words, input line and tabs in the bottom bar; sheets slide up over it */
:root{
  --canvas:#F6F6F4;--surface:#FFFFFF;--pressed:#EDEDEA;
  --ink:#1D1D22;--ink2:#5C5C66;--ink3:#62626C;
  --action:#232327;--on-action:#FFFFFF;--action-pressed:#3A3A40;
  --t-state:#ECE8FB;--t-memory:#E3F3EA;--t-doctor:#E4EEFB;
  --accent-bg:#FCE6D6;--accent:#8F3D12;
  --line:#E4E4E0;--control:#86868E;--focus:#8C7FD6;
  --toast:#FFFFFF;--toast-btn:#F6F6F4;--toast-ink:#1D1D22;--toast-accent:#8F3D12;--toast-line:#232327;
  --scrim:rgba(18,18,20,.38);--desk:#E9E9E5;--shadow:rgba(0,0,0,.16);
  --m1:#FFF3EA;--m2:#F6C9A9;--m3:#E29870;--mcheek:#EC8565;--mink:#4A3226;--mshadow:#3A2A20;
  --font:'Onest',-apple-system,'SF Pro Text',system-ui,'Segoe UI',sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#121214;--surface:#1E1E22;--pressed:#2A2A2F;--ink:#F2F2F4;--ink2:#A9A9B3;--ink3:#9C9CA6;
  --action:#F2F2F4;--on-action:#121214;--action-pressed:#D8D8DE;--t-state:#2A2540;--t-memory:#1F3329;--t-doctor:#1F2A3B;
  --accent-bg:#3A2418;--accent:#F2B28C;--line:#2E2E33;--control:#76767F;--focus:#A99CF0;
  --toast:#1E1E22;--toast-btn:#2A2A2F;--toast-ink:#F2F2F4;--toast-accent:#F2B28C;--toast-line:#F2F2F4;--scrim:rgba(0,0,0,.55);--desk:#0B0B0C;--shadow:rgba(0,0,0,.5);
  --mshadow:#000000;color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#121214;--surface:#1E1E22;--pressed:#2A2A2F;--ink:#F2F2F4;--ink2:#A9A9B3;--ink3:#9C9CA6;
  --action:#F2F2F4;--on-action:#121214;--action-pressed:#D8D8DE;--t-state:#2A2540;--t-memory:#1F3329;--t-doctor:#1F2A3B;
  --accent-bg:#3A2418;--accent:#F2B28C;--line:#2E2E33;--control:#76767F;--focus:#A99CF0;
  --toast:#1E1E22;--toast-btn:#2A2A2F;--toast-ink:#F2F2F4;--toast-accent:#F2B28C;--toast-line:#F2F2F4;--scrim:rgba(0,0,0,.55);--desk:#0B0B0C;--shadow:rgba(0,0,0,.5);
  --mshadow:#000000;color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font:400 17px/1.4 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.phone{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--canvas);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px) and (min-height:720px){.phone{height:min(880px,calc(100% - 32px));margin-top:16px;border-radius:44px;box-shadow:0 24px 70px var(--shadow)}}
.scr{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 16px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:16px}
.bot{flex:none;padding-block:8px 0;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:8px;background:var(--canvas)}

/* type: DS text styles */
.lt{font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.t2{font-weight:600;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
.q{font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.b{font-size:17px;line-height:1.4;margin:0}
.bs{font-weight:600;font-size:17px;line-height:1.35;margin:0}
.c{font-size:15px;line-height:1.35;margin:0}
.cs{font-weight:600;font-size:15px;line-height:1.35;margin:0}
.f{font-size:13px;line-height:1.3;margin:0}
.big{font-weight:700;font-size:34px;line-height:1.05;margin:0;font-variant-numeric:tabular-nums}
.ink2{color:var(--ink2)}
.acc{color:var(--accent);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:12px}
.col8{display:flex;flex-direction:column;gap:8px}
.col4{display:flex;flex-direction:column;gap:4px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.center{align-items:center;text-align:center}

/* header */
.hd{display:flex;align-items:flex-start;gap:8px}
.ib{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.ib:active{background:var(--pressed)}
.ib.surf{background:var(--surface)}

/* context line */
.ctx{display:flex;flex-wrap:wrap;gap:0 18px;margin-top:-6px}
.cx{min-height:44px;display:inline-flex;align-items:center;gap:6px;font-size:15px;line-height:1.3;color:var(--ink)}
.cx svg{color:var(--ink2);flex:none}
.cx .v{font-weight:600}
.cx.off{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control)}

/* cards and lists */
.card{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px;flex:none}
.surf{background:var(--surface)}.state{background:var(--t-state)}.memory{background:var(--t-memory)}.doctor{background:var(--t-doctor)}
.lbl{font-weight:600;font-size:15px;line-height:1.35;color:var(--ink2);margin:0}
.rows{display:flex;flex-direction:column}
.fi{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.fi:last-child{border-bottom:0}
.fi:active{opacity:.7}
.fi .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fi .tt .bs,.fi .tt .c{overflow-wrap:anywhere}
.fi .tm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ico{width:44px;height:44px;border-radius:22px;background:var(--canvas);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.th{width:52px;height:52px;border-radius:14px;object-fit:cover;flex:none;background:var(--pressed);display:block}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li svg{flex:none;color:var(--ink2)}
.list{background:var(--surface);border-radius:22px;padding:0 16px;flex:none}

/* buttons */
.btn{min-height:60px;border-radius:999px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:18px;line-height:1.2;width:100%;text-align:center}
.pri{background:var(--action);color:var(--on-action)}.pri:active{background:var(--action-pressed)}
.sec{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink)}.sec:active{background:var(--pressed)}
.btn:disabled{opacity:.4;cursor:default}
.link{min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--ink2);width:100%;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control)}
.choice{min-height:56px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--control);padding:8px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:17px;line-height:1.2;text-align:center}
.choice:active{background:var(--pressed)}
.choice.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.ch3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch3 .choice,.ch2 .choice{padding:8px 10px;min-width:0}
.chip{min-height:44px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--control);display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-weight:600;font-size:15px;line-height:1.25;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:active{background:var(--pressed)}
.chip.on{background:var(--action);color:var(--on-action);box-shadow:none}
.chip .star{color:var(--accent)}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr);flex:none}
.hs::-webkit-scrollbar{display:none}
.hs .chip{flex:none;max-width:260px}

/* input line v4 */
.line{height:64px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--control);display:flex;align-items:center;gap:6px;padding:0 6px;flex:none}
.line:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.cam{height:48px;min-width:48px;border-radius:24px;background:var(--canvas);display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;cursor:pointer;color:var(--ink);font-weight:600;font-size:15px}
.cam.wide{padding:0 14px 0 12px}
.cam:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.cam:active{background:var(--pressed)}
.lin{flex:1;min-width:0;height:48px;border:0;background:transparent;font-size:17px;outline:none;padding:0 4px}
.lin::placeholder{color:var(--ink2)}
.mic{width:52px;height:52px;border-radius:26px;background:var(--action);color:var(--on-action);display:inline-flex;align-items:center;justify-content:center;flex:none}
.mic:active{background:var(--action-pressed)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);flex:none;border-top:1px solid var(--line);margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr)}
.tab{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-weight:500;font-size:12px;line-height:1.2;text-align:center}
.tab.on{color:var(--ink);font-weight:600}

/* toast */
.toast{background:var(--toast);color:var(--toast-ink);box-shadow:0 8px 28px var(--shadow),inset 0 0 0 1px var(--line);border-radius:22px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:12px;flex:none;animation:up .22s ease}
.toast .tr{display:flex;gap:10px;align-items:flex-start}
.toast .tic{color:var(--toast-accent);flex:none;margin-top:1px}
.toast .tt{flex:1;min-width:0}
.toast .tt .bs,.toast .tt .c{overflow-wrap:anywhere}
.toast .c{color:var(--ink2)}
.toast .ta{display:flex;gap:12px}
.toast .tb{flex:1;min-height:52px;border-radius:26px;background:var(--toast-btn);box-shadow:inset 0 0 0 1px var(--control);color:var(--toast-ink);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.toast .tx{width:44px;height:44px;margin:-10px -8px -10px 0;display:inline-flex;align-items:center;justify-content:center;border-radius:22px;color:var(--toast-ink);flex:none}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--canvas);border-radius:28px 28px 0 0;max-height:calc(100% - 40px);overflow-y:auto;padding-block:8px 24px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:16px;animation:up .26s cubic-bezier(.2,.8,.2,1);outline:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--control);align-self:center;flex:none}
.shd{display:flex;align-items:center;gap:4px;margin-top:-4px}
.shd .t2{padding-left:4px}
.photo{width:100%;max-height:300px;object-fit:cover;border-radius:22px;background:var(--pressed);display:block}
.field{min-height:52px;border-radius:26px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--control);border:0;padding:12px 18px;font-size:17px;width:100%;outline:none;resize:none}
.field:focus{box-shadow:inset 0 0 0 2px var(--ink)}
textarea.field{border-radius:22px;min-height:96px;line-height:1.4}
.ai{display:flex;gap:8px;align-items:flex-start;color:var(--ink2)}
.ai svg{flex:none;margin-top:1px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--control);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:var(--surface);transition:left .2s}
.sw.on{background:var(--action)}.sw.on::after{left:22px;background:var(--on-action)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .chip{flex:1 1 auto;justify-content:center}

/* month */
.ib.on{background:var(--action);color:var(--on-action)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .wd{font-size:13px;line-height:1.3;color:var(--ink2);text-align:center}
.mday{min-height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
.mday:active{background:var(--pressed)}
.mday:disabled{opacity:.35;cursor:default}
.mday.td{background:var(--action);color:var(--on-action)}
.mday.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mday.td.sel{box-shadow:inset 0 0 0 2px var(--on-action),0 0 0 2px var(--ink)}
.mday .mk{display:flex;gap:3px;align-items:center;height:5px}
.mday .mk i{width:5px;height:5px;border-radius:3px;background:currentColor;display:block}
.mday .mk b{width:12px;height:3px;border-radius:2px;background:currentColor;opacity:.6;display:block}
/* generated answer */
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.strip i{height:24px;border-radius:4px;background:var(--line);display:block}
.strip i.on{background:var(--ink)}
.strip i.td{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.sx{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.kvr{display:grid;grid-template-columns:minmax(96px,38%) 1fr;gap:4px 12px}

/* voice */
.bars{display:flex;gap:6px;align-items:center;justify-content:center;height:56px}
.bars i{width:6px;border-radius:3px;background:var(--ink);height:16px;animation:bar 1s ease-in-out infinite;display:block}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}

/* mascot */
.masc{display:block;flex:none;overflow:visible}
.masc .mb{transform-origin:60px 104px;animation:breathe 4.5s ease-in-out infinite}

/* onboarding */
.ob{height:100%;display:flex;flex-direction:column}
.obb{flex:1;min-height:0;overflow-y:auto;padding-block:12px 12px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:20px}
.obf{flex:none;padding-block:8px 16px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:4px}

@keyframes up{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bar{0%,100%{height:12px}50%{height:44px}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.985)}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{animation:none}.masc .mb,.bars i{animation:none}.sw,.sw::after{transition:none}}
</style>
<div id="app"></div>
<script src="https://unpkg.com/htm@3.1.1/preact/standalone.umd.js"></script>
<script>
// ===== core: i18n, dates, storage, lexicon, simulated context, computations =====
const {html, render, useState, useEffect, useRef} = htmPreact;
const NBSP=' ';
const SHORT=new Set('в во к ко с со о об у и а но да не ни на по за из до от без для при про под над что как или это'.split(' '));
function nb(s){
  if(typeof s!=='string'||s.indexOf(' ')<0) return s;
  const w=s.split(' ');let o='';
  for(let i=0;i<w.length;i++){
    o+=w[i];
    if(i<w.length-1){
      const cur=w[i].toLowerCase().replace(/^[«„"(]+/,'');
      const nx=w[i+1];const nxc=nx.toLowerCase().replace(/[.,!?:;»")]+$/,'');
      const glue=SHORT.has(cur)||nx==='—'||nxc==='же'||nxc==='ли'||nxc==='бы'||(/^\d+([.,]\d+)?$/.test(cur)&&nx&&!/^[\d–—→]/.test(nx));
      o+=glue?NBSP:' ';
    }
  }
  return o;
}
function nbE(s){
  if(typeof s!=='string') return s;
  let r='';for(let i=0;i<s.length;i++){const ch=s[i];if(ch===' '&&i>0&&/[0-9]/.test(s[i-1])&&i+1<s.length&&!/[0-9\s–—→]/.test(s[i+1])) r+=NBSP; else r+=ch;}return r;
}
let LANG='ru';
const L=(ru,en)=>LANG==='en'?nbE(en===undefined?ru:en):nb(ru);
const EN=()=>LANG==='en';
function withLang(lg,fn){const p=LANG;LANG=lg;try{return fn();}finally{LANG=p;}}
function plRu(n,a,b,c){const x=Math.abs(n)%100,y=x%10;if(x>10&&x<20)return c;if(y>1&&y<5)return b;if(y===1)return a;return c;}
const nEnt=n=>EN()?`${n} ${n===1?'entry':'entries'}`:`${n} ${plRu(n,'запись','записи','записей')}`;
const nDay=n=>EN()?`${n} ${n===1?'day':'days'}`:`${n} ${plRu(n,'день','дня','дней')}`;
const nQ=n=>EN()?`${n} ${n===1?'question':'questions'}`:`${n} ${plRu(n,'вопрос','вопроса','вопросов')}`;
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const qt=s=>LANG==='en'?'“'+s+'”':'«'+s+'»';
const lc=s=>s?s[0].toLowerCase()+s.slice(1):s;
const esc=s=>String(s==null?'':s);

// ---- dates (app clock can be shifted for testing) ----
const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
let ST=null,UP=null,UI=null,SUI=null;
const now=()=>new Date(Date.now()+((ST&&ST.offset)||0));
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromDk=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12,0,0);};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const ddiff=(a,b)=>Math.round((fromDk(dk(a))-fromDk(dk(b)))/DAY);
const todayK=()=>dk(now());
const MRG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MRN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MEN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WRU=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WRS=['вс','пн','вт','ср','чт','пт','сб'];
const WEN=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WES=['sun','mon','tue','wed','thu','fri','sat'];
const fDM=d=>EN()?`${MEN[d.getMonth()]} ${d.getDate()}`:`${d.getDate()} ${MRG[d.getMonth()]}`;
const fHdr=d=>EN()?`${WEN[d.getDay()]}, ${MEN[d.getMonth()].toLowerCase()} ${d.getDate()}`:`${WRU[d.getDay()]}, ${d.getDate()} ${MRG[d.getMonth()]}`;

function analyzeRest(t){
  const n=norm(t);
  if(DOC_PREFIX.test(n))return {kind:'doctorq',q:t.replace(new RegExp(DOC_PREFIX.source,'i'),'').trim()||t};
  const keys=symsIn(t);
  const isQ=/\?\s*$/.test(t)||Q_START.test(n);
  if(isQ){if(MED_Q.test(n)&&!/^(когда|сколько|как часто|when|how many|how often)/.test(n))return {kind:'medical',keys};return {kind:'query',keys};}
  const medWord=/(таблет|лекарств|укол|pill|meds|medication|tablet|shot|injection)/.test(n)||(ST&&ST.meds.some(m=>n.indexOf(norm(m.name).split(' ')[0])>=0));
  if(MED_TAKE.test(n)&&medWord&&!keys.length)return {kind:'med'};
  const when=parseWhen(t);
  if(hasFood(t)){const items=foodItems(t);if(items.length)return {kind:'food',items,meal:mealIn(t),feel:keys,when};}
  if(keys.length){
    const ctx=parseCtx(t);
    const clauses=t.split(/[,;.!]|\s(?:и|а|но|and|but)\s/);const items=[];let last=null;
    for(const cl of clauses){const ks=symsIn(cl);const s=strengthOf(cl);
      if(ks.length){for(const k of ks){if(items.find(i=>i.key===k))continue;const it={key:k,s:null,ctx:ctx.slice()};items.push(it);last=it;}if(s&&last)last.s=s;}
      else if(s&&last&&!last.s)last.s=s;}
    for(const k of keys)if(!items.find(i=>i.key===k))items.push({key:k,s:null,ctx:ctx.slice()});
    return {kind:'sym',items,when};
  }
  return {kind:'unknown'};
}

function periodStarts(){

function topSyms(from,to,limit){const c={};for(const e of symEnts())if(e.d>=from&&e.d<=to)c[e.key]=(c[e.key]||0)+1;return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,limit||3);}
function heatCount(k,from,to){const l=symEnts(k).filter(e=>e.d>=from&&e.d<=to);return {n:l.length,h:l.filter(e=>(e.ctx||[]).some(c=>HEAT.includes(c))||isHot(new Date(e.at))).length};}
function coincidences(){
  const end=fromDk(todayK());const days=[];for(let i=29;i>=0;i--)days.push(dk(addD(end,-i)));const d0=days[0];
  const foodDays=new Set(E().filter(e=>e.kind==='food'&&e.d>=d0).map(e=>e.d));
  if(foodDays.size<7)return {few:true,n:foodDays.size};
  const symDay=new Set(E().filter(e=>e.kind==='sym'&&e.d>=d0).map(e=>e.d));
  const hit=d=>symDay.has(d)||symDay.has(dk(addD(fromDk(d),1)));
  const res=[];
  for(const g of Object.keys(GROUPS)){
    const gD=days.filter(d=>E().some(e=>e.kind==='food'&&e.d===d&&(e.items||[]).some(it=>inGroup(it,g))));
    if(gD.length<3)continue;
    const after=gD.filter(hit);const oth=[...foodDays].filter(d=>!gD.includes(d));const othA=oth.filter(hit);
    res.push({g,n:gD.length,a:after.length,o:oth.length,oa:othA.length,days:after,hot:after.filter(d=>isHot(fromDk(d))).length,sl:ST.health?after.filter(d=>sleepFor(fromDk(d))<6).length:null,pre:periodStarts().length?after.filter(prePeriod).length:null});
  }
  res.sort((x,y)=>(y.a/y.n-y.oa/Math.max(1,y.o))-(x.a/x.n-x.oa/Math.max(1,x.o)));
  return {few:false,res,n:foodDays.size};
}
function checkEndK(c){return dk(addD(fromDk(c.start),c.days-1));}
const checkOver=()=>ST.check&&todayK()>checkEndK(ST.check);
const checkDayN=()=>ST.check?ddiff(now(),fromDk(ST.check.start))+1:0;
function checkResult(c){
  const s=fromDk(c.start),e=addD(s,c.days-1),b0=addD(s,-c.days),b1=addD(s,-1);
  const rng=(a,b)=>{const out=[];for(let d=new Date(a);d<=b;d=addD(d,1))out.push(dk(d));return out;};
  const D=rng(s,e),B=rng(b0,b1);
  const cnt=ds=>symEnts().filter(x=>ds.includes(x.d)).length;
  const worse=ds=>ds.filter(k=>inWorse(k)||symEnts().some(x=>x.d===k&&x.s===3)).length;
  const hot=ds=>weatherOn()?ds.filter(k=>isHot(fromDk(k))).length:null;
  const sl=ds=>ST.health?ds.reduce((a,k)=>a+sleepFor(fromDk(k)),0)/ds.length:null;
  const per=ds=>periodStarts().length?ds.some(k=>onPeriod(fromDk(k))):null;
  return {during:cnt(D),before:cnt(B),wD:worse(D),wB:worse(B),hD:hot(D),hB:hot(B),sD:sl(D),sB:sl(B),pD:per(D),pB:per(B)};
}
function walkSpeed(d){return 1.02+hsh('w'+dk(d))*0.14;}

      if(af)lines.push(EN()?`${cap(symName(k))} within 3 hours after food: ${af} of ${all.length}`:`${cap(symName(k))} в течение 3 часов после еды: ${af} из ${all.length}`);
      if(ef)lines.push(EN()?`After effort: ${ef} of ${all.length}`:`После нагрузки: ${ef} из ${all.length}`);}

    const meds=ST.meds;if(meds.length){S.push({lab:L('терапия','therapy'),text:meds.map(m=>{const taken=E().filter(e=>e.kind==='med'&&e.name===m.name&&e.d>=fk).length;const how=m.how==='course'?L('курс','course'):m.how==='asNeeded'?L('по необходимости','as needed'):L('постоянно','regularly');return cap(`${m.name}, ${how}`+(taken?L(`, отмечено приемов: ${taken}`,`, doses marked: ${taken}`):''));}).join('. ')});}

    const words=symEnts().filter(e=>e.d>=fk&&e.words).slice(0,3).map(e=>qt(e.words));
    if(words.length)S.push({lab:L('своими словами','in the person’s words'),text:words.join(', ')+(EN()?'. Original words; auto-translation is part of the app, not this prototype':'')});
    const qs=ST.questions.filter(q=>q.status!=='done');if(qs.length)S.push({lab:L('вопросы к врачу','questions for the doctor'),list:qs.map(q=>q.text)});
    return {range:fRange(from,end),from,end,sections:S,few:symEnts().filter(e=>e.d>=fk).length<5,ws,top};
  });
}
function newLong(fk){const out=[];const keys=[...new Set(symEnts().map(e=>e.key))];
  for(const k of keys){const l=symEnts(k).slice().reverse();if(!l.length||l[0].d<fk)continue;const first=l[0],last=l[l.length-1];if(ST.firstDay&&first.d<=ST.firstDay)continue;if(ddiff(now(),fromDk(first.d))>14)continue;if(last.at-first.at<DAY)continue;
    const gone=E().some(e=>e.kind==='gone'&&e.key===k&&e.at>last.at);out.push({key:k,first:first.d,last:last.d,gone});}
  return out;}

function symNameFrom(v){let t=' '+v.replace(/[.!?]+$/,'')+' ';

  t=t.replace(/(^|\s)(сегодня|вчера|позавчера|утром|с утра|днем|вечером|ночью|сейчас|опять|снова|немного|чуть|слегка|слабо|заметно|сильно|очень|жутко|ужасно|today|yesterday|this morning|morning|afternoon|evening|tonight|now|again|a bit|slightly|mildly|noticeably|really|very|badly)(?=\s)/gi,' ');
  t=t.replace(/\s+/g,' ').trim();return (t||v.trim()).slice(0,40);}

function readPhoto(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onload=()=>{try{const m=520,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72));}catch(e){rej(e);}};img.onerror=rej;img.src=fr.result;};fr.readAsDataURL(file);});
}
async function onPhoto(ev){
  const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  if(f.type&&!/^image\//.test(f.type))return toast({title:L('Это не фото','That is not a photo'),sub:L('Выберите снимок еды','Choose a photo of food'),icon:'info'});
  try{const src=await readPhoto(f);const fresh=f.lastModified&&Math.abs(Date.now()-f.lastModified)<3*36e5;openSheet('photo',{src,at:fresh?f.lastModified:null});}
  catch(e){toast({title:L('Не получилось открыть фото','Could not open the photo'),sub:L('Попробуйте другой снимок','Try another photo'),icon:'info'});}
}

  const apply=(ch,label,title)=>{const old={};for(const k in ch)old[k]=x[k];const was=x.edited;Object.assign(x,ch,{edited:Date.now()});if(ch.at)x.d=dk(new Date(ch.at));sortE();save();setM('view');
    toast({title:title||L('Исправила','Changed'),sub:label,acts:[{l:L('отменить','undo'),fn:()=>{Object.assign(x,old);if(old.at)x.d=dk(new Date(old.at));x.edited=was;sortE();save();toast({title:L('Вернула как было','Restored'),icon:'undo'});}}]});};

  const R=(f,lab,val)=>html`<button class="li" onClick=${()=>{if(f==='words')setTxt(x.words||'');if(f==='items')setTxt((x.items||[]).join(', '));setM(f);}}><span class="tt"><span class="f ink2">${lab}</span><span class="bs">${val}</span></span><${I} n="chevR"/></button>`;
  const rows=x.kind==='sym'?[R('what',L('что','what'),symName(x.key)),R('s',L('сила','strength'),x.s?cap(sName(x.s)):L('не указана','not set')),R('when',L('когда','when'),cap(relDT(new Date(x.at)))),R('words',L('ваши слова','your words'),x.words?qt(x.words):L('нет','none'))]

function symStats(k,days){
  const T=fromDk(todayK()),from=dk(addD(T,-(days-1)));const l=symEnts(k).filter(x=>x.d>=from);const ds=new Set(l.map(x=>x.d));const strip=[];
  for(let i=days-1;i>=0;i--){const kk=dk(addD(T,-i));strip.push({k:kk,on:ds.has(kk)});}
  const heat=l.filter(x=>(x.ctx||[]).some(c=>HEAT.includes(c))||isHot(new Date(x.at))).length;
  const pre=periodStarts().length?l.filter(x=>prePeriod(x.d)).length:null;
  const afc=l.filter(x=>(x.ctx||[]).some(c=>c.indexOf('food:')===0));const dish={};for(const x of afc){const lab=x.ctx.find(c=>c.indexOf('food:')===0).split('|')[1];dish[lab]=(dish[lab]||0)+1;}
  const dishes=Object.entries(dish).sort((a,b)=>b[1]-a[1]).slice(0,3);const effort=l.filter(x=>(x.ctx||[]).includes('effort')).length;
  return {n:l.length,days:ds.size,last:l[0]||null,heat,pre,strip,af:afc.length,dishes,effort};
}

      ${s.af?html`<p class="c">${L('В течение 3 часов после еды: ','Within 3 hours after food: ')}<span class="num">${s.af} ${L('из','of')} ${s.n}</span>${s.dishes.length?html`<span class="ink2">${' ('+s.dishes.map(d=>d[0]+(d[1]>1?' ×'+d[1]:'')).join(', ')+')'}</span>`:null}</p>`:null}
      ${s.effort?html`<p class="c">${L('После нагрузки: ','After effort: ')}<span class="num">${s.effort} ${L('из','of')} ${s.n}</span></p>`:null}
      ${s.pre!==null?html`<p class="c">${L('За 1–3 дня до месячных: ','1–3 days before a period: ')}<span class="num">${s.pre} ${L('из','of')} ${s.n}</span></p>`:null}
    </div>
  </section>`;
}
function FoodBlock({yday}){
  const T=now();const days=yday?[dk(addD(T,-1))]:[todayK(),dk(addD(T,-1)),dk(addD(T,-2))];
  const g=days.map(d=>({d,l:onDay(d).filter(x=>x.kind==='food')})).filter(x=>x.l.length);
  if(!g.length)return html`<section class="card surf"><p class="b">${yday?L('Вчера записей о еде нет.','No food entries yesterday.'):L('За три дня записей о еде нет.','No food entries in three days.')}</p></section>`;
  return html`${g.map(x=>html`<section class="card surf"><p class="lbl">${dayHead(x.d)}</p><div class="rows">${x.l.map(y=>html`<${FeedRow} key=${y.id} x=${y}/>`)}</div></section>`)}`;
}
function HeatBlock(){
  if(!weatherOn())return html`<section class="card surf"><p class="b">${L('Погода не подключена, жаркие дни я не вижу.','Weather is off, so I cannot see hot days.')}</p><button class="btn sec" onClick=${()=>openSheet('settings')}>${L('включить погоду','turn on weather')}</button></section>`;
  const T=fromDk(todayK());const days=[];for(let i=13;i>=0;i--)days.push(dk(addD(T,-i)));
  const hot=days.filter(d=>isHot(fromDk(d)));const cnt=ds=>symEnts().filter(x=>ds.includes(x.d)).length;const cold=days.filter(d=>!hot.includes(d));
  return html`<section class="card surf"><p class="lbl">${L('жара, 14 дней','heat, 14 days')}</p>
    <div class="row" style="align-items:baseline;gap:10px"><span class="big">${hot.length}</span><span class="b">${EN()?(hot.length===1?'hot day':'hot days')+' (26° and above)':plRu(hot.length,'жаркий день','жарких дня','жарких дней')+' (от 26°)'}</span></div>
    <div class="kvr"><span class="c ink2">${L('в жаркие дни','on hot days')}</span><span class="c num">${nEnt(cnt(hot))}</span><span class="c ink2">${L('в остальные','on other days')}</span><span class="c num">${nEnt(cnt(cold))}, ${nDay(cold.length)}</span></div></section>`;
}
function AnswerSheet({q,keys,medical}){
  const n=norm(q);const isFood=/((^|\s)(ел|ела|ели|съел\S*)(?=\s|$|\?)|еда|еду|еды|поесть|\bate\b|\beat|food|meal)/.test(n);const isHeat=/(жар|жарк|heat|hot)/.test(n);
  const ks=(keys||[]).slice(0,2);const has=ks.length||isFood||isHeat;
  const ex=EN()?['When were my fingers numb?','What did I eat yesterday?','How was it in the heat?']:['Когда немело?','Какая еда была вчера?','Как было в жару?'];
  return html`<${Frame} title=${qt(q)}>
    ${medical?html`<section class="card doctor"><h3 class="q">${L('на это лучше ответит врач','your doctor is the right person for this')}</h3>
      <p class="b">${L('Я не даю медицинских советов. Могу добавить вопрос в список к приему.','I do not give medical advice. I can add this to your list for the visit.')}</p>
      <button class="btn pri" onClick=${()=>{closeSheet();addQuestion(q);}}>${L('добавить вопрос врачу','add question for the doctor')}</button></section>
      ${ks.length?html`<p class="lbl">${L('что есть в записях','what your entries show')}</p>`:null}`:null}
    ${ks.map(k=>html`<${SymBlock} k=${k}/>`)}
    ${isFood&&!medical?html`<${FoodBlock} yday=${/(вчера|yesterday)/.test(n)}/>`:null}
    ${isHeat&&!medical?html`<${HeatBlock}/>`:null}
    ${!has&&!medical?html`<section class="card surf"><p class="b">${L('Не нашла этого в записях. Попробуйте спросить так:','I did not find this in your entries. Try asking:')}</p><div class="col8">${ex.map(a=>html`<button class="chip" onClick=${()=>handleText(a)}><${I} n="spark" s=${18}/><span>${a}</span></button>`)}</div></section>`:null}
    <p class="ai f"><${I} n="spark" s=${16}/><span>${L('Ответ собран из ваших записей: это совпадения по времени, не причины. ИИ может ошибаться. Это не медицинская рекомендация.','Built from your entries: these are coincidences in time, not causes. AI can make mistakes. Not medical advice.')}</span></p>
    ${has?html`<button class="btn sec" onClick=${()=>{UI.filter=isFood&&!ks.length?'food':ks.length?'sym':'all';UI.tab='history';closeSheet();}}>${L('открыть в истории','open in history')}</button>`:null}
  </${Frame}>`;
}

function emergencyNo(){let r='';try{r=(Intl.DateTimeFormat().resolvedOptions().locale||navigator.language||'').split('-').pop().toUpperCase();}catch(e){}if(r==='RU')return L('112 или 103','112 or 103');if(r==='US'||r==='CA')return '911';return '112';}
function SafetySheet({v}){
  return html`<${Frame} title=${L('если это началось внезапно','if this started suddenly')}>
    <p class="b">${L('Звоните в скорую. Не ждите и не полагайтесь на приложение.','Call emergency services. Do not wait and do not rely on the app.')}</p>
    <div class="card surf"><p class="lbl">${L('скорая','emergency')}</p><p class="big num" style="user-select:all">${emergencyNo()}</p></div>
    <div class="col"><button class="btn pri" onClick=${closeSheet}>${L('понятно','got it')}</button><button class="btn sec" onClick=${()=>{closeSheet();logNote(v);}}>${L('записать как есть','save as written')}</button></div>
  </${Frame}>`;
}

function CopySheet({txt}){
  return html`<${Frame} title=${L('скопировать сводку','copy summary')}><p class="c ink2">${L('Браузер не дал скопировать автоматически. Выделите текст и скопируйте.','The browser blocked copying. Select the text and copy it.')}</p>
    <textarea class="field" id="cptxt" readonly style="min-height:240px" value=${txt} onFocus=${e=>e.target.select()}></textarea></${Frame}>`;
}

function SettingsSheet(){
  const [m,setM]=useState('main');
  const set=(k,v)=>{ST[k]=v;save();};
  if(m==='mainsym')return html`<${Frame} title=${L('главный для меня','my main one')} onBack=${()=>setM('main')}><p class="c ink2">${L('Будет первым в быстрых словах над строкой.','It goes first in the quick words above the line.')}</p>
    <${Choices} cols=${2} opts=${[{id:null,l:L('не выбран','none')}].concat(Object.keys(SYM).map(k=>({id:k,l:symName(k)})))} val=${ST.main} pick=${k=>{set('main',k);setM('main');}}/></${Frame}>`;
  if(m==='demo'||m==='wipe')return html`<${Frame} title=${m==='demo'?L('заменить данные примером?','replace data with a sample?'):L('стереть все данные?','erase all data?')} onBack=${()=>setM('main')}>
    <p class="b">${m==='demo'?L('Ваши записи в этом браузере заменятся записями за три недели.','Your entries in this browser will be replaced with three weeks of sample entries.'):L('Записи, вопросы и настройки удалятся из этого браузера. Вернуть их будет нельзя.','Entries, questions and settings will be removed from this browser. This cannot be undone.')}</p>
    <div class="col"><button class="btn sec" onClick=${()=>{if(m==='demo'){seedDemo();save();closeSheet();toast({title:L('Загрузила пример','Sample loaded'),sub:L('Три недели записей','Three weeks of entries')});}else{const lg=ST.lang;ST=defaults();ST.lang=lg;ST.photoUsed=false;ST.demo=false;save();closeSheet();UI.tab='today';rr();}}}>${m==='demo'?L('заменить','replace'):L('стереть','erase')}</button>
    <button class="btn pri" onClick=${()=>setM('main')}>${L('отмена','cancel')}</button></div></${Frame}>`;
  return html`<${Frame} title=${L('настройки','settings')}>
    <div class="col8"><p class="lbl">${L('язык','language')}</p><${SegRow} lab=${L('Язык','Language')} val=${ST.lang} opts=${[['ru','Русский'],['en','English']]} pick=${v=>{ST.lang=v;LANG=v;save();}}/></div>
    <div class="col8"><p class="lbl">${L('тема','theme')}</p><${SegRow} lab=${L('Тема','Theme')} val=${ST.theme} opts=${[['system',L('как в системе','system')],['light',L('светлая','light')],['dark',L('темная','dark')]]} pick=${v=>{set('theme',v);applyTheme();}}/></div>
    <div class="list">
      <${SwRow} on=${ST.health} t="Apple Health" s=${L('Шаги, сон, цикл и терапия. В прототипе имитация','Steps, sleep, cycle and therapy. Simulated here')} fn=${()=>{ST.health=!ST.health;if(ST.health&&!ST.seed)ST.seed=dk(addD(now(),-11));if(!ST.health&&ST.cycle==='health')ST.cycle='off';else if(ST.health&&ST.cycle==='off')ST.cycle='health';save();}}/>
      <${SwRow} on=${ST.geo} t=${L('Погода','Weather')} s=${L('По геопозиции. В прототипе имитация','By location. Simulated here')} fn=${()=>set('geo',!ST.geo)}/>
      <button class="li" onClick=${()=>setM('mainsym')}><span class="tt"><span class="bs">${L('главный для меня','my main one')}</span><span class="c ink2">${ST.main?symName(ST.main):L('не выбран','none')}</span></span><${I} n="chevR"/></button>
    </div>
    <div class="list">
      <button class="li" onClick=${()=>setM('demo')}><span class="tt"><span class="bs">${L('заполнить примером','load sample data')}</span><span class="c ink2">${L('Три недели записей для теста','Three weeks of entries for testing')}</span></span><${I} n="chevR"/></button>
      <button class="li" onClick=${()=>setM('wipe')}><span class="tt"><span class="bs">${L('стереть все данные','erase all data')}</span></span><${I} n="chevR"/></button>
    </div>
    <p class="f ink2">${L('Прототип v4. Данные хранятся только в этом браузере.','Prototype v4. Data stays in this browser only.')}</p>
  </${Frame}>`;
}
const SH={rec:RecSheet,photo:PhotoSheet,quick:QuickSheet,voice:VoiceSheet,answer:AnswerSheet,safety:SafetySheet,copy:CopySheet,settings:SettingsSheet};
function SheetHost(){
  const s=UI.sheet;
  useEffect(()=>{if(!s)return;const el=document.querySelector('.sheet');if(el)el.focus();},[s&&s.k]);
  if(!s)return null;const C=SH[s.name];if(!C)return null;
  return html`<div class="scrim" onClick=${closeSheet} aria-hidden="true"></div><${C} key=${s.k} ...${s}/>`;
}

let THEMED=false;
function applyTheme(){const r=document.documentElement;if(ST.theme==='light'||ST.theme==='dark'){r.setAttribute('data-theme',ST.theme);THEMED=true;}else if(THEMED){r.removeAttribute('data-theme');THEMED=false;}}

render(html`<${App}/>`,document.getElementById('app'));
