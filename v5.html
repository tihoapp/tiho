<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<title>ms-app</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ms-app">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ms-app v5 web. Layout: one phone column; scroll area, then toast, quick words, input line and tabs in the bottom bar; sheets slide up over it */
:root{
  --canvas:#F6F6F4;--surface:#FFFFFF;--pressed:#EDEDEA;
  --ink:#1D1D22;--ink2:#5C5C66;--ink3:#62626C;
  --action:#232327;--on-action:#FFFFFF;--action-pressed:#3A3A40;
  --t-state:#ECE8FB;--t-memory:#E3F3EA;--t-doctor:#E4EEFB;
  --accent-bg:#FCE6D6;--accent:#8F3D12;
  --line:#E4E4E0;--control:#86868E;--focus:#8C7FD6;
  --toast:#FFFFFF;--toast-btn:#F6F6F4;--toast-ink:#1D1D22;--toast-accent:#8F3D12;--toast-line:#232327;
  --scrim:rgba(18,18,20,.38);--desk:#E9E9E5;--shadow:rgba(0,0,0,.16);
  --m1:#FFF3EA;--m2:#F6C9A9;--m3:#E29870;--mcheek:#EC8565;--mink:#4A3226;--mshadow:#3A2A20;
  --font:'Onest',-apple-system,'SF Pro Text',system-ui,'Segoe UI',sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#121214;--surface:#1E1E22;--pressed:#2A2A2F;--ink:#F2F2F4;--ink2:#A9A9B3;--ink3:#9C9CA6;
  --action:#F2F2F4;--on-action:#121214;--action-pressed:#D8D8DE;--t-state:#2A2540;--t-memory:#1F3329;--t-doctor:#1F2A3B;
  --accent-bg:#3A2418;--accent:#F2B28C;--line:#2E2E33;--control:#76767F;--focus:#A99CF0;
  --toast:#1E1E22;--toast-btn:#2A2A2F;--toast-ink:#F2F2F4;--toast-accent:#F2B28C;--toast-line:#F2F2F4;--scrim:rgba(0,0,0,.55);--desk:#0B0B0C;--shadow:rgba(0,0,0,.5);
  --mshadow:#000000;color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#121214;--surface:#1E1E22;--pressed:#2A2A2F;--ink:#F2F2F4;--ink2:#A9A9B3;--ink3:#9C9CA6;
  --action:#F2F2F4;--on-action:#121214;--action-pressed:#D8D8DE;--t-state:#2A2540;--t-memory:#1F3329;--t-doctor:#1F2A3B;
  --accent-bg:#3A2418;--accent:#F2B28C;--line:#2E2E33;--control:#76767F;--focus:#A99CF0;
  --toast:#1E1E22;--toast-btn:#2A2A2F;--toast-ink:#F2F2F4;--toast-accent:#F2B28C;--toast-line:#F2F2F4;--scrim:rgba(0,0,0,.55);--desk:#0B0B0C;--shadow:rgba(0,0,0,.5);
  --mshadow:#000000;color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font:400 17px/1.4 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.phone{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--canvas);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:600px) and (min-height:720px){.phone{height:min(880px,calc(100% - 32px));margin-top:16px;border-radius:44px;box-shadow:0 24px 70px var(--shadow)}}
.scr{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 16px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:16px}
.bot{flex:none;padding-block:8px 0;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:8px;background:var(--canvas)}

/* type: DS text styles */
.lt{font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.t2{font-weight:600;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
.q{font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.b{font-size:17px;line-height:1.4;margin:0}
.bs{font-weight:600;font-size:17px;line-height:1.35;margin:0}
.c{font-size:15px;line-height:1.35;margin:0}
.cs{font-weight:600;font-size:15px;line-height:1.35;margin:0}
.f{font-size:13px;line-height:1.3;margin:0}
.big{font-weight:700;font-size:34px;line-height:1.05;margin:0;font-variant-numeric:tabular-nums}
.ink2{color:var(--ink2)}
.acc{color:var(--accent);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:12px}
.col8{display:flex;flex-direction:column;gap:8px}
.col4{display:flex;flex-direction:column;gap:4px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.center{align-items:center;text-align:center}

/* header */
.hd{display:flex;align-items:flex-start;gap:8px}
.ib{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.ib:active{background:var(--pressed)}
.ib.surf{background:var(--surface)}

/* context line */
.ctx{display:flex;flex-wrap:wrap;gap:0 18px;margin-top:-6px}
.cx{min-height:44px;display:inline-flex;align-items:center;gap:6px;font-size:15px;line-height:1.3;color:var(--ink)}
.cx svg{color:var(--ink2);flex:none}
.cx .v{font-weight:600}
.cx.off{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control)}

/* cards and lists */
.card{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px;flex:none}
.surf{background:var(--surface)}.state{background:var(--t-state)}.memory{background:var(--t-memory)}.doctor{background:var(--t-doctor)}
.lbl{font-weight:600;font-size:15px;line-height:1.35;color:var(--ink2);margin:0}
.rows{display:flex;flex-direction:column;gap:4px}
.fi{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0;width:100%;text-align:left}
.fi:active{opacity:.7}
.fi .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fi .tt .bs,.fi .tt .c{overflow-wrap:anywhere}
.fi .tm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ico{width:44px;height:44px;border-radius:22px;background:var(--canvas);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.th{width:52px;height:52px;border-radius:14px;object-fit:cover;flex:none;background:var(--pressed);display:block}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li svg{flex:none;color:var(--ink2)}
.list{background:var(--surface);border-radius:22px;padding:0 16px;flex:none}

/* buttons */
.btn{min-height:60px;border-radius:999px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:18px;line-height:1.2;width:100%;text-align:center}
.pri{background:var(--action);color:var(--on-action)}.pri:active{background:var(--action-pressed)}
.sec{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink)}.sec:active{background:var(--pressed)}
.btn:disabled{opacity:.4;cursor:default}
.link{min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--ink2);width:100%;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control)}
.choice{min-height:56px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--control);padding:8px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:17px;line-height:1.2;text-align:center}
.choice:active{background:var(--pressed)}
.choice.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.ch3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch3 .choice,.ch2 .choice{padding:8px 10px;min-width:0}
.chip{min-height:44px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--control);display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-weight:600;font-size:15px;line-height:1.25;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:active{background:var(--pressed)}
.chip.on{background:var(--action);color:var(--on-action);box-shadow:none}
.chip .star{color:var(--accent)}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr);flex:none}
.hs::-webkit-scrollbar{display:none}
.hs .chip{flex:none;max-width:260px}

/* input line */
.line{height:64px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--control);display:flex;align-items:center;gap:6px;padding:0 6px;flex:none}
.line:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.cam{height:48px;min-width:48px;border-radius:24px;background:var(--canvas);display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;cursor:pointer;color:var(--ink);font-weight:600;font-size:15px}
.cam.wide{padding:0 14px 0 12px}
.cam:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.cam:active{background:var(--pressed)}
.lin{flex:1;min-width:0;height:48px;border:0;background:transparent;font-size:17px;outline:none;padding:0 4px}
.lin::placeholder{color:var(--ink2)}
.mic{width:52px;height:52px;border-radius:26px;background:var(--action);color:var(--on-action);display:inline-flex;align-items:center;justify-content:center;flex:none}
.mic:active{background:var(--action-pressed)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);flex:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr)}
.tab{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-weight:500;font-size:12px;line-height:1.2;text-align:center}
.tab.on{color:var(--ink);font-weight:600}

/* toast */
.toast{background:var(--toast);color:var(--toast-ink);box-shadow:0 8px 28px var(--shadow),inset 0 0 0 1px var(--line);border-radius:22px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:12px;flex:none;animation:up .22s ease}
.toast .tr{display:flex;gap:10px;align-items:flex-start}
.toast .tic{color:var(--toast-accent);flex:none;margin-top:1px}
.toast .tt{flex:1;min-width:0}
.toast .tt .bs,.toast .tt .c{overflow-wrap:anywhere}
.toast .c{color:var(--ink2)}
.toast .ta{display:flex;gap:12px}
.toast .tb{flex:1;min-height:52px;border-radius:26px;background:var(--toast-btn);box-shadow:inset 0 0 0 1px var(--control);color:var(--toast-ink);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.toast .tx{width:44px;height:44px;margin:-10px -8px -10px 0;display:inline-flex;align-items:center;justify-content:center;border-radius:22px;color:var(--toast-ink);flex:none}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--canvas);border-radius:28px 28px 0 0;max-height:calc(100% - 40px);overflow-y:auto;padding-block:8px 24px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:16px;animation:up .26s cubic-bezier(.2,.8,.2,1);outline:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--control);align-self:center;flex:none}
.shd{display:flex;align-items:center;gap:4px;margin-top:-4px}
.shd .t2{padding-left:4px}
.photo{width:100%;max-height:300px;object-fit:cover;border-radius:22px;background:var(--pressed);display:block}
.field{min-height:52px;border-radius:26px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--control);border:0;padding:12px 18px;font-size:17px;width:100%;outline:none;resize:none}
.field:focus{box-shadow:inset 0 0 0 2px var(--ink)}
textarea.field{border-radius:22px;min-height:96px;line-height:1.4}
.ai{display:flex;gap:8px;align-items:flex-start;color:var(--ink2)}
.ai svg{flex:none;margin-top:1px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--control);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:var(--surface);transition:left .2s}
.sw.on{background:var(--action)}.sw.on::after{left:22px;background:var(--on-action)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .chip{flex:1 1 auto;justify-content:center}

/* month */
.ib.on{background:var(--action);color:var(--on-action)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .wd{font-size:13px;line-height:1.3;color:var(--ink2);text-align:center}
.mday{min-height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
.mday:active{background:var(--pressed)}
.mday:disabled{opacity:.35;cursor:default}
.mday.td{background:var(--action);color:var(--on-action)}
.mday.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mday.td.sel{box-shadow:inset 0 0 0 2px var(--on-action),0 0 0 2px var(--ink)}
.mday .mk{display:flex;gap:3px;align-items:center;height:5px}
.mday .mk i{width:5px;height:5px;border-radius:3px;background:currentColor;display:block}
.mday .mk b{width:12px;height:3px;border-radius:2px;background:currentColor;opacity:.6;display:block}
/* generated answer */
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.strip i{height:24px;border-radius:4px;background:var(--line);display:block}
.strip i.on{background:var(--ink)}
.strip i.td{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.sx{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.kvr{display:grid;grid-template-columns:minmax(96px,38%) 1fr;gap:4px 12px}

/* day chart */
.dchart{display:flex;gap:2px;align-items:flex-end;height:72px}
.dchart .dcol{flex:1;min-width:0;display:flex;flex-direction:column-reverse;gap:1px;height:100%}
.dchart .dcol i{display:block;border-radius:2px;min-height:3px}
.sw2{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
/* voice */
.bars{display:flex;gap:6px;align-items:center;justify-content:center;height:56px}
.bars i{width:6px;border-radius:3px;background:var(--ink);height:16px;animation:bar 1s ease-in-out infinite;display:block}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}

/* mascot */
.masc{display:block;flex:none;overflow:visible}
.masc .mb{transform-origin:60px 104px;animation:breathe 4.5s ease-in-out infinite}

/* onboarding */
.ob{height:100%;display:flex;flex-direction:column}
.obb{flex:1;min-height:0;overflow-y:auto;padding-block:12px 12px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:12px}
.obb>:first-child{margin-top:auto}.obb>:last-child{margin-bottom:auto}
.obf{flex:none;padding-block:8px 16px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:4px}

@keyframes up{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bar{0%,100%{height:12px}50%{height:44px}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.985)}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{animation:none}.masc .mb,.bars i{animation:none}.sw,.sw::after{transition:none}}

/* v5 web = figma v5/v5b */
.spacer{flex:1 0 0;min-height:0}
.grid{display:flex;flex-direction:column;gap:8px;flex:none}
.grow2{display:flex;gap:8px;align-items:stretch}
.grow2 .chip{flex:1 1 0;min-width:0;min-height:56px;justify-content:center;padding:0 12px}
.grow2 .sp{flex:1 1 0}
.grid .lbl{margin-top:2px}
.acard{background:var(--surface);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;flex:none}
.foot{padding-top:8px;display:flex;flex-direction:column;gap:8px}
.rec{display:flex;align-items:center;gap:10px;min-height:28px}
.rec .dot{width:10px;height:10px;border-radius:5px;background:var(--accent);flex:none;animation:blink 1.2s ease-in-out infinite}
.rec .bars{height:28px;gap:3px;flex:none}
.rec .bars i{width:3px;background:var(--ink2);height:12px}
.rec .bars i:nth-child(6){animation-delay:.75s}.rec .bars i:nth-child(7){animation-delay:.9s}.rec .bars i:nth-child(8){animation-delay:.2s}.rec .bars i:nth-child(9){animation-delay:.5s}.rec .bars i:nth-child(10){animation-delay:.05s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.mt{margin-bottom:0}
.li.hint{padding-top:8px;padding-bottom:0;min-height:48px}
.li.hint .chev{color:var(--ink2)}
.eyebrow{font-size:13px;color:var(--ink2);margin:0}
@media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
html.ax .scr,html.ax .bot{zoom:1.18}
.bigs .b,.bigs .c,.bigs .kvr span{font-size:1.25em;line-height:1.35}

/* explicit feedback: numb fingers must know the tap landed.
   the finger covers the button, so the signal also goes outside it: ring + whole-phone buzz on saves */
.press{transform:scale(.92)!important;filter:brightness(.88);transition:transform 50ms ease-out,filter 50ms ease-out!important}
.sw.press,.cx.press,.link.press{transform:scale(.9)!important}
@keyframes buzz{0%{transform:scale(.92)}8%{transform:translateX(-5px) scale(1.05)}16%{transform:translateX(5px) scale(1.04)}24%{transform:translateX(-5px) scale(1.03)}32%{transform:translateX(5px) scale(1.02)}40%{transform:translateX(-4px) scale(1.01)}48%{transform:translateX(4px) scale(1)}58%{transform:translateX(-3px)}68%{transform:translateX(3px)}78%{transform:translateX(-2px)}88%{transform:translateX(1px)}100%{transform:none}}
@keyframes tapflash{0%{box-shadow:inset 0 0 0 1px var(--control)}20%{box-shadow:inset 0 0 0 3px var(--ink)}100%{box-shadow:inset 0 0 0 1px var(--control)}}
@keyframes ringout{0%{outline-offset:0;opacity:1}100%{outline-offset:18px;opacity:0}}
@keyframes ringfade{0%{opacity:1}100%{opacity:0}}
@keyframes pbuzz{0%,100%{transform:none}10%{transform:translate(-3px,1px)}20%{transform:translate(3px,-1px)}30%{transform:translate(-3px,0)}40%{transform:translate(3px,1px)}50%{transform:translate(-2px,-1px)}60%{transform:translate(2px,0)}70%{transform:translate(-2px,1px)}80%{transform:translate(1px,0)}90%{transform:translate(-1px,0)}}
@keyframes toastin{0%{transform:translateY(16px) scale(.96);opacity:0}45%{transform:translateY(-4px) scale(1.02);opacity:1}60%{transform:translateX(-5px)}72%{transform:translateX(5px)}84%{transform:translateX(-3px)}100%{transform:none;opacity:1}}
.tap{animation:buzz .34s linear both!important}
.chip.tap,.choice.tap{animation:buzz .34s linear both,tapflash .55s ease both!important}

<script>
// ===== core: i18n, dates, storage, lexicon, simulated context, computations =====
const {html, render, useState, useEffect, useRef} = htmPreact;
const NBSP=' ';
const SHORT=new Set('в во к ко с со о об у и а но да не ни на по за из до от без для при про под над что как или это'.split(' '));
function nb(s){
  if(typeof s!=='string'||s.indexOf(' ')<0) return s;
  const w=s.split(' ');let o='';
  for(let i=0;i<w.length;i++){
    o+=w[i];
    if(i<w.length-1){
      const cur=w[i].toLowerCase().replace(/^[«„"(]+/,'');
      const nx=w[i+1];const nxc=nx.toLowerCase().replace(/[.,!?:;»")]+$/,'');
      const glue=SHORT.has(cur)||nx==='—'||nxc==='же'||nxc==='ли'||nxc==='бы'||(/^\d+([.,]\d+)?$/.test(cur)&&nx&&!/^[\d–—→]/.test(nx));
      o+=glue?NBSP:' ';
    }
  }
  return o;
}
function nbE(s){
  if(typeof s!=='string') return s;
  let r='';for(let i=0;i<s.length;i++){const ch=s[i];if(ch===' '&&i>0&&/[0-9]/.test(s[i-1])&&i+1<s.length&&!/[0-9\s–—→]/.test(s[i+1])) r+=NBSP; else r+=ch;}return r;
}
let LANG='ru';
const L=(ru,en)=>LANG==='en'?nbE(en===undefined?ru:en):nb(ru);
const EN=()=>LANG==='en';
function withLang(lg,fn){const p=LANG;LANG=lg;try{return fn();}finally{LANG=p;}}
function plRu(n,a,b,c){const x=Math.abs(n)%100,y=x%10;if(x>10&&x<20)return c;if(y>1&&y<5)return b;if(y===1)return a;return c;}
const nEnt=n=>EN()?`${n} ${n===1?'entry':'entries'}`:`${n} ${plRu(n,'запись','записи','записей')}`;

const nQ=n=>EN()?`${n} ${n===1?'question':'questions'}`:`${n} ${plRu(n,'вопрос','вопроса','вопросов')}`;
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;

// ---- dates (app clock can be shifted for testing) ----
const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
let ST=null,UP=null,UI=null,SUI=null;
const now=()=>new Date(Date.now()+((ST&&ST.offset)||0));
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromDk=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12,0,0);};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const ddiff=(a,b)=>Math.round((fromDk(dk(a))-fromDk(dk(b)))/DAY);
const todayK=()=>dk(now());
const MRG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MRN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MEN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WRU=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WRS=['вс','пн','вт','ср','чт','пт','сб'];
const WEN=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WES=['sun','mon','tue','wed','thu','fri','sat'];
const fDM=d=>EN()?`${MEN[d.getMonth()]} ${d.getDate()}`:`${d.getDate()} ${MRG[d.getMonth()]}`;
const fHdr=d=>EN()?`${WEN[d.getDay()]}, ${MEN[d.getMonth()].toLowerCase()} ${d.getDate()}`:`${WRU[d.getDay()]}, ${d.getDate()} ${MRG[d.getMonth()]}`;
const fMon=d=>EN()?MEN[d.getMonth()].toLowerCase():MRN[d.getMonth()];
const fWdS=d=>EN()?WES[d.getDay()]:WRS[d.getDay()];
function fT(d){const h=d.getHours(),m=pad(d.getMinutes());if(EN()){const h12=h%12||12;return `${h12}:${m} ${h<12?'AM':'PM'}`;}return `${pad(h)}:${m}`;}
function fRange(a,b){
  if(dk(a)===dk(b)) return fDM(a);
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()) return EN()?`${MEN[a.getMonth()]} ${a.getDate()}–${b.getDate()}`:`${a.getDate()}–${b.getDate()} ${MRG[a.getMonth()]}`;
  return `${fDM(a)} – ${fDM(b)}`;
}
function rel(d){const n=ddiff(now(),d);if(n===0)return L('сегодня','today');if(n===1)return L('вчера','yesterday');if(n===2)return L('позавчера','2 days ago');return EN()?`${n} days ago`:`${n} ${plRu(n,'день','дня','дней')} назад`;}
function relDT(d){const n=ddiff(now(),d);const t=fT(d);if(n===0)return L('сегодня','today')+', '+t;if(n===1)return L('вчера','yesterday')+', '+t;if(n===2)return L('позавчера','2 days ago')+', '+t;return fDM(d)+', '+t;}
function dayTitle(d){const n=ddiff(now(),d);if(n===0)return L('сегодня','today');if(n===1)return L('вчера','yesterday');if(n===2)return L('позавчера','2 days ago');return EN()?WEN[d.getDay()]:WRU[d.getDay()];}

// ---- storage ----
const KEY='msapp.v5';let MEM=null;
function defaults(){return {v:1,onboarded:false,lang:'ru',theme:'system',ai:'device',symptoms:['numb','fatigue','fog'],custom:{},main:'numb',
  health:false,cycle:'off',cyclePaused:false,periodMarks:[],seed:null,city:null,geo:false,photosKeep:true,
  comfort:{haptic:true,sound:false,badDay:true,morning:false},entries:[],worse:null,worseHist:[],worsePrompt:null,check:null,checks:[],
  visit:{date:null,noDate:false,notes:[]},questions:[],meds:[],dismiss:{},offset:0,firstDay:null,voiceLang:'ui',sumLang:'ui',icloud:true,healthMed:false};}
function loadS(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(defaults(),o,{comfort:Object.assign(defaults().comfort,o.comfort||{})});}}catch(e){}return MEM||defaults();}
function saveS(s){MEM=s;try{localStorage.setItem(KEY,JSON.stringify(s));return true;}catch(e){return false;}}
let idc=0;const uid=()=>'e'+Date.now().toString(36)+(idc++).toString(36)+Math.random().toString(36).slice(2,5);

// ---- catalog ----
const SYM={numb:['Онемение пальцев','Numb fingers'],fatigue:['Усталость','Fatigue'],fog:['Туман в голове','Brain fog'],legs:['Слабость в ногах','Weak legs'],
  vision:['Двоение в глазах','Double vision'],dizzy:['Головокружение','Dizziness'],tingle:['Покалывание','Tingling'],sleep:['Плохой сон','Poor sleep'],
  headache:['Головная боль','Headache'],flush:['Покраснение лица','Facial redness'],stomach:['Тяжесть в животе','Heavy stomach'],spasm:['Спазмы','Spasms'],
  balance:['Шаткость','Unsteadiness'],bladder:['Частые позывы','Bladder urgency'],blur:['Нечеткое зрение','Blurred vision'],weak:['Слабость','Weakness'],pain:['Боль','Pain'],fever:['Температура или болезнь','Fever or illness']};
const OB_SYM=['numb','fatigue','fog','legs','vision','dizzy','tingle','sleep'];
function symName(k){if(SYM[k])return L(SYM[k][0],SYM[k][1]);const c=ST&&ST.custom[k];return c?c:(k||'');}
const SN={1:['слабо','mild'],2:['заметно','noticeable'],3:['сильно','strong']};
const sName=s=>s?L(SN[s][0],SN[s][1]):'';

const cmpName=c=>CMP[c]?L(CMP[c][0],CMP[c][1]):'';
const CTXP={shower:['после горячего душа','after a hot shower'],bath:['после ванны','after a bath'],sauna:['после бани','after a sauna'],hot:['в жару','in the heat'],workout:['после тренировки','after a workout'],walk:['после прогулки','after a walk'],stress:['после стресса','after stress'],effort:['после нагрузки','after effort']};

const HEAT=['shower','bath','sauna','hot'];
function ctxText(c,chip){if(c.indexOf('food:')===0){const p=c.slice(5).split('|');const m=+p[0];return EN()?`${m} min after ${p[1]}`:`через ${m} мин после ${p[1]}`;}if(c.indexOf('med:')===0)return L('после: ','after: ')+c.slice(4);const t=(chip?CTXC:CTXP)[c];return t?L(t[0],t[1]):c;}
const MEALS={breakfast:['завтрак','breakfast'],lunch:['обед','lunch'],dinner:['ужин','dinner'],snack:['перекус','snack'],food:['еда','food']};

const MOVES={walk:['прогулка','walk'],yoga:['йога','yoga'],swim:['бассейн','swimming'],pt:['ЛФК','physical therapy'],bike:['велосипед','cycling']};
const moveName=k=>MOVES[k]?L(MOVES[k][0],MOVES[k][1]):k;

const GROUPS={
  dairy:{n:['молочное','dairy'],gen:['молочного','dairy'],ins:['с молочным','with dairy'],sub:['молоко, сыр, йогурт, творог','milk, cheese, yogurt, cottage cheese'],st:['молок','молочн','сыр','творог','йогурт','кефир','сметан','сливк','морожен','капучино','латте','milk','cheese','yogurt','yoghurt','cream','latte','cappuccino']},
  gluten:{n:['глютен','gluten'],gen:['глютена','gluten'],ins:['с глютеном','with gluten'],sub:['хлеб, макароны, выпечка','bread, pasta, pastry'],st:['хлеб','булк','батон','тост','макарон','паст','спагет','пицц','печень','торт','пирож','пирог','выпечк','блин','хачапури','хинкали','пельмен','вареник','лаваш','bread','toast','bagel','pasta','spaghetti','noodle','pizza','cookie','biscuit','cake','pastry','pancake','dumpling']},

const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');

// ---- lexicon ----
const LEX=[
  ['fever',/(температур|простыл|простуд|болею|заболел|грипп|инфекц|озноб|ангин|fever|\bflu\b|a cold|feel sick|\bsick\b|infection|chills)/],
  ['headache',/(болит голов|голова болит|головн\S* бол|мигрен|headache|migraine)/],
  ['numb',/(неме|немот|не чувству\S* пальц|numb)/],
  ['fatigue',/(устал|усталост|утомл|нет сил|без сил|разбит|вымота|tired|fatigue|exhaust|worn out)/],
  ['fog',/(туман|тормож|не соображ|рассеян|забываю|brain fog|foggy|\bfog\b)/],
  ['legs',/(слабост\S* в ног|ноги слаб|ватн\S* ног|ноги ватн|ноги не держ|weak legs|legs (feel |are )?weak)/],
  ['vision',/(двоит|двоени|двоится|double vision|seeing double)/],
  ['blur',/(расплыв|нечетк|мутно в глаз|пелена|blurr)/],

  ['tingle',/(покалыв|мурашк|tingl|pins and needles)/],
  ['sleep',/(плохо спал|не спал|не выспал|бессонн|просыпал|плохой сон|poor sleep|bad sleep|couldn.?t sleep|didn.?t sleep|insomnia)/],
  ['flush',/(покраснел|прилив|flush|red face|face (got |went |is )?red)/],
  ['stomach',/(тяжест\S* в живот|тяжесть после|вздут|живот|stomach|bloat)/],
  ['spasm',/(спазм|судорог|сводит|spasm|cramp)/],
  ['balance',/(шатает|шатало|равновеси|координац|unsteady|off balance|wobbl)/],
  ['bladder',/(позыв|мочев|bladder|urgency)/],
  ['weak',/(слабост|weakness)/],
  ['pain',/(боль|болит|болел|болят|pain|hurt|ache)/]

const S3=new Set('сильно очень жутко ужасно невыносимо сильная сильный сильное сильные сильнее strong strongly severe very really badly terrible awful'.split(' '));
const S2=new Set('заметно средне ощутимо прилично умеренно заметное заметная noticeable noticeably moderate moderately quite'.split(' '));
const S1=new Set('слабо слегка чуть немного немножко слабое легкое легкая mild mildly slight slightly little'.split(' '));
const toks=t=>norm(t).split(/[^a-zа-я0-9-]+/).filter(Boolean);
function strengthOf(t){const ts=toks(t);if(ts.some(x=>S3.has(x)))return 3;if(ts.some(x=>S2.has(x)))return 2;if(ts.some(x=>S1.has(x)))return 1;return null;}
function symsIn(t){
  const n=norm(t);const out=[];
  for(const [k,re] of LEX){const m=n.match(re);if(m&&!out.find(o=>o.k===k)){if(k==='weak'&&out.find(o=>o.k==='legs'))continue;if(k==='pain'&&out.find(o=>o.k==='headache'))continue;out.push({k,i:m.index});}}
  if(ST)for(const [k,v] of Object.entries(ST.custom)){const i=n.indexOf(norm(v));if(i>=0&&!out.find(o=>o.k===k))out.push({k,i});}
  return out.sort((a,b)=>a.i-b.i).map(o=>o.k);
}
function parseCtx(t){
  const n=norm(t);const c=[];
  if(/душ(?!н)|shower/.test(n))c.push('shower');else if(/ванн|\bbath/.test(n))c.push('bath');
  if(/бан[яиюе]|саун|sauna/.test(n))c.push('sauna');
  if(!c.length&&/(жара|жары|жару|жарко|в жару|духот|heat|hot weather|it.?s hot)/.test(n))c.push('hot');
  if(/(после|after)\s+(\S+\s+)?(таблет|укол|инъекц|лекарств|капельниц|pill|tablet|injection|shot|meds|medication)/.test(n)){const m=(ST&&ST.meds[0]);c.push('med:'+(m?m.name:L('лекарство','medication')));}
  if(/после (трениров|зарядк|спорт|занят)|after (a |the |my )?(workout|exercise|gym|training)/.test(n))c.push('workout');
  if(/после прогулк|after (a |the |my )?walk/.test(n))c.push('walk');
  if(/(стресс|нервнич|понервнич|stress)/.test(n))c.push('stress');
  if(/(гиперфокус|перегруз|после работ|после созвон|после учеб|сосредоточ|много работ|много дел|после уборк|hyperfocus|overdid|after work|after a meeting|after studying|long day)/.test(n))c.push('effort');
  return c;
}
function parseWhen(t){
  const n=norm(t);const nw=now();let y=0;
  if(/позавчера/.test(n))y=2;else if(/вчера|yesterday/.test(n))y=1;
  let hr=null;

function symStats(k,days){
  const T=fromDk(todayK()),from=dk(addD(T,-(days-1)));const l=symEnts(k).filter(x=>x.d>=from);const ds=new Set(l.map(x=>x.d));const strip=[];
  for(let i=days-1;i>=0;i--){const kk=dk(addD(T,-i));strip.push({k:kk,on:ds.has(kk)});}
  const heat=l.filter(x=>(x.ctx||[]).some(c=>HEAT.includes(c))||isHot(new Date(x.at))).length;
  const pre=periodStarts().length?l.filter(x=>prePeriod(x.d)).length:null;
  const afc=l.filter(x=>(x.ctx||[]).some(c=>c.indexOf('food:')===0));const dish={};for(const x of afc){const lab=x.ctx.find(c=>c.indexOf('food:')===0).split('|')[1];dish[lab]=(dish[lab]||0)+1;}
  const dishes=Object.entries(dish).sort((a,b)=>b[1]-a[1]).slice(0,3);const effort=l.filter(x=>(x.ctx||[]).includes('effort')).length;
  return {n:l.length,days:ds.size,last:l[0]||null,heat,pre,strip,af:afc.length,dishes,effort};
}

function say(o){if(o&&o.kind==='log')return toast(o.t);UI.resp=Object.assign({kind:'info'},o);rr();}
// main toast: dark card above the day card, hides after 4 s, buttons live inside
function toast(o){const t=Object.assign({id:++TID,where:UI.sheet?'sheet':'main',icon:'check',acts:[]},o);if(t.where==='sheet'){UI.toast=t;}else{UI.resp=null;UI.mtoast=t;if(V6&&t.acts&&t.acts.length){const top=onDay(todayK()).filter(x=>!(x.src==='health')).slice(0,3);const f=top.find(e=>e.made&&Date.now()-e.made<800);if(f)t.inline6=f.id;}}if(typeof speak==='function')speak(t.title+(t.sub?'. '+t.sub:''));if(typeof haptic==='function')haptic(t.icon==='info'?'warn':t.icon==='undo'?'undo':'save');rr();}
function MainToast(){const t=UI.mtoast;useEffect(()=>{if(!t)return;const id=t.id;const h=setTimeout(()=>{if(UI.mtoast&&UI.mtoast.id===id){UI.mtoast=null;rr();}},t.acts&&t.acts.length?6000:4000);return ()=>clearTimeout(h);},[t&&t.id]);if(!t)return null;if(V6&&t.inline6&&!UI.resp)return null;
  return html`<div class="toast mt" role="status"><div class="tr"><span class="tic"><${I} n=${t.icon}/></span><div class="tt"><p class="bs">${t.title}</p>${t.sub?html`<p class="c">${t.sub}</p>`:null}</div><button class="tx" aria-label=${L('Скрыть','Dismiss')} onClick=${()=>{UI.mtoast=null;rr();}}><${I} n="close" s=${20}/></button></div>${t.acts&&t.acts.length?html`<div class="ta">${t.acts.map(a=>html`<button class="tb" onClick=${()=>{UI.mtoast=null;a.fn();rr();}}>${a.l}</button>`)}</div>`:null}</div>`;}
// chip grid: two columns, no horizontal scroll, long label takes the row
function ChipGrid({items,label}){
  const rows=[];let cur=null;
  for(const it of items){const long=((it.l||'').length+(it.star||it.cam||it.ic?3:0))>LIM();if(long){cur=null;rows.push([it]);continue;}if(!cur||cur.length===2){cur=[];rows.push(cur);}cur.push(it);}
  const Chip=({x})=>html`<button class=${'chip'+(x.on?' on':'')} aria-pressed=${x.on===undefined?undefined:!!x.on} aria-label=${x.aria||undefined} onClick=${x.fn}>${x.star?html`<span class="star"><${I} n="star" s=${18}/></span>`:x.cam?html`<${I} n="cam" s=${18}/>`:x.ic?html`<${I} n=${x.ic} s=${18}/>`:null}<span>${x.l}</span></button>`;
  return html`<div class="grid" role="group" aria-label=${label||L('Подсказки','Suggestions')}>${rows.map((r,i)=>html`<div class="grow2" key=${i}>${r.map(x=>html`<${Chip} x=${x} key=${x.l}/>`)}${r.length===1&&((r[0].l||'').length+(r[0].star||r[0].cam||r[0].ic?3:0))<=LIM()?html`<span class="sp" aria-hidden="true"></span>`:null}</div>`)}</div>`;
}

// ---- commands by phrase: no settings screen ----
function cmdBase(v){
  const n=norm(v);
  const wrap=(title,sub)=>say({kind:'log',t:{title,sub,icon:'check',acts:[]}});
  if(n==='settings'||/^(настройки|settings)$/.test(n))return say({kind:'settings'});
  if(/^(данные|данные и доступ|data|data and access)$/.test(n))return say({kind:'data'});
  if(/^v(5b?|6)$/.test(n)){try{localStorage.setItem('msapp.mode',n);}catch(e){}location.search='?v='+n;return true;}
  if(/(истори|покажи записи|все записи|history|show (my )?entries|all entries)/.test(n))return say({kind:'history',per:30,f:'all'});
  if(/(хуже обычного|хуже чем обычно|плохой день|worse than usual|bad day)/.test(n)&&!/(^|\s)(вернул\S*|назад|уже|нормально|back|normal)/.test(n)){
    if(ST.worse)return toast({title:L('Хуже обычного, день ','Worse than usual, day ')+worseDayN(),sub:L('Скажите «вернулось к обычному», когда пройдет','Say “back to usual” when it passes'),icon:'info',acts:[]});
    ST.worse={start:todayK()};save();return toast({title:L('Записала: хуже обычного','Saved: worse than usual'),sub:L('Буду отмечать дни, пока не скажете, что вернулось к обычному. Это попадет в сводку','I will mark the days until you say it is back to usual. This goes into the summary'),acts:[undoAct([])&&{l:L('отменить','undo'),fn:()=>{ST.worse=null;save();toast({title:L('Отменила','Undone'),icon:'undo'});}}]});}
  if(/(вернулось к обычному|уже нормально|стало как обычно|back to usual|back to normal)/.test(n)){
    if(!ST.worse)return toast({title:L('Хуже обычного не отмечали','Nothing marked as worse than usual'),icon:'info',acts:[]});
    const w={start:ST.worse.start,end:todayK()};ST.worseHist.push(w);ST.worse=null;save();
    return toast({title:L('Записала: вернулось к обычному','Saved: back to usual'),sub:(EN()?`${nDay(ddiff(fromDk(w.end),fromDk(w.start))+1)} worse than usual, `:`${nDay(ddiff(fromDk(w.end),fromDk(w.start))+1)} хуже обычного, `)+fRange(fromDk(w.start),fromDk(w.end))+L('. В сводке к врачу','. In the doctor summary'),acts:[{l:L('сводка к врачу','doctor summary'),fn:()=>say({kind:'summary',days:30})}]});}
  if(/(что делалось|what was going on)/.test(n)&&(ST.worse||ST.worseHist.length)){const w=ST.worse||ST.worseHist[ST.worseHist.length-1];return say({kind:'answer',q:v,keys:[],range:{a:w.start,b:w.end||todayK(),l:L('эти дни','these days')},list:true});}
  if(/(месячные начались|начались месячные|period started|my period started|got my period)/.test(n)){
    if(ST.cycle!=='health'){ST.cycle='manual';}if(!ST.periodMarks.includes(todayK()))ST.periodMarks.push(todayK());if(ST.cycle==='health'){ST.cycle='manual';}save();
    return toast({title:L('Записала: месячные начались','Saved: period started'),sub:L('Сегодня день цикла 1. Дни до месячных теперь считаются от этой даты. Цикл виден только вам','Today is cycle day 1. Days before a period now count from this date. Only you can see the cycle'),acts:[{l:L('как это связано с циклом?','how is it linked to my cycle?'),fn:()=>say({kind:'cycle',keys:[]})}]});}
  if(/^(пауза|pause|сегодня пауза|pause today)$/.test(n)){const ids=addEntries([{kind:'pause',at:now().getTime()}]);save();return toast({title:L('Пауза','Paused'),sub:L('Записи сохранены, подсказок не будет, пока не вернетесь','Entries are kept, no suggestions until you are back'),acts:[undoAct(ids)]});}
  if(/(english|англий|на англ)/.test(n)){ST.lang='en';ST.langSet=true;LANG='en';save();return wrap('Switched to English');}
  if(/(по-русски|по русски|русский|russian)/.test(n)){ST.lang='ru';ST.langSet=true;LANG='ru';save();return wrap('Переключила на русский');}
  if(/(темн\S* тем|dark (theme|mode))/.test(n)){ST.theme='dark';save();applyTheme();return wrap(L('Темная тема','Dark theme'));}
  if(/(светл\S* тем|light (theme|mode))/.test(n)){ST.theme='light';save();applyTheme();return wrap(L('Светлая тема','Light theme'));}
  if(/(как в системе|system theme)/.test(n)){ST.theme='system';save();applyTheme();return wrap(L('Тема как в системе','Theme follows the system'));}
  if(/(подключ\S*|включ\S*|connect|turn on|enable).{0,12}(здоровье|health)/.test(n)){ST.health=true;if(!ST.seed)ST.seed=dk(addD(now(),-11));if(ST.cycle==='off')ST.cycle='health';save();return wrap(L('Подключила Здоровье','Health connected'));}
  if(/(отключ\S*|выключ\S*|disconnect|turn off|disable).{0,12}(здоровье|health)/.test(n)){ST.health=false;if(ST.cycle==='health')ST.cycle='off';save();return wrap(L('Отключила Здоровье','Health disconnected'));}
  if(/(подключ\S*|включ\S*|connect|turn on|enable).{0,12}(погод|weather)/.test(n)){ST.geo=true;save();return wrap(L('Включила погоду','Weather on'));}
  if(/(отключ\S*|выключ\S*|disconnect|turn off|disable).{0,12}(погод|weather)/.test(n)){ST.geo=false;save();return wrap(L('Выключила погоду','Weather off'));}
  if(/(главн\S* для меня|main (one|symptom))/.test(n)){const ks=symsIn(v);if(ks.length){ST.main=ks[0];save();return wrap(L('Главный для меня: ','My main one: ')+symName(ks[0]));}return wrap(L('Назовите симптом: «главный для меня: усталость»','Name it: “main one: fatigue”'));}
  if(/(стереть|удалить все|сбросить|erase|reset everything|wipe)/.test(n)){return say({kind:'confirm',title:L('стереть все данные?','erase all data?'),sub:L('Вернуть будет нельзя','This cannot be undone'),ok:L('стереть','erase'),fn:()=>{const lg=ST.lang;ST=defaults();ST.lang=lg;ST.photoUsed=false;ST.demo=false;ST.onboarded=true;ST.firstDay=todayK();save();wrap(L('Стерла. Это снова первый день','Erased. First day again'));}});}
  if(/(пример|sample|demo)/.test(n)){return say({kind:'confirm',title:L('заменить данные примером?','replace data with a sample?'),sub:L('Ваши записи заменятся примером','Your entries get replaced with a sample'),ok:L('заменить','replace'),fn:()=>{seedDemo();save();wrap(L('Загрузила пример','Sample loaded'));}});}
  if(/(что ты (умеешь|можешь)|помощь|help|what can you do)/.test(n))return say({kind:'help'});
  if(/^(мои |my )?(вопросы|questions)( к| для)?( врач\S*| (the |my )?doctor)?\??$/.test(n))return say({kind:'questions',q:v});
  if(/(сводк|summary|^к врачу$|^(for the |to the )?doctor$)/.test(n)&&!/вопрос|question/.test(n)){const d=/(месяц|30|month)/.test(n)?30:/(полгод|180|six)/.test(n)?182:92;return say({kind:'summary',q:v,days:d});}
  if(/(цикл|месячн|cycle|period)/.test(n)&&/\?$|как|how|влия|affect/.test(n))return say({kind:'cycle',q:v,keys:symsIn(v)});
  if(/(связ|совпад|после чего|после какой|что влия|инсайт|триггер|link|related|pattern|insight|trigger|after what)/.test(n)&&!/^(почему|why)/.test(n))return say({kind:'insights',q:v,keys:symsIn(v)});
  return false;
}

// ---- answers rendered in the main block ----
function monthOf(n){const i=[...MRN,...MRG].findIndex(m=>n.indexOf(m.slice(0,4))>=0);if(i>=0)return i%12;const j=MEN.findIndex(m=>n.indexOf(m.slice(0,3).toLowerCase())>=0);return j>=0?j:null;}
function answer(q,keys,medical){
  const n=norm(q);
  if(/(сводк|к врачу|for (the |my )?doctor|summary)/.test(n)&&!medical)return say({kind:'summary',q});
  if(/(вопрос|question)/.test(n)&&/(врач|doctor)/.test(n)&&!medical)return say({kind:'questions',q});
  const isFood=/((^|\s)(ел|ела|ели|съел\S*)(?=\s|$|\?)|еда|еду|еды|поесть|\bate\b|\beat|food|meal)/.test(n);
  const isHeat=/(жар|жарк|heat|hot)/.test(n);
  let range=null;const T=fromDk(todayK());
  if(/(вчера|yesterday)/.test(n))range={a:dk(addD(T,-1)),b:dk(addD(T,-1)),l:L('вчера','yesterday')};
  else if(/(сегодня|today)/.test(n))range={a:todayK(),b:todayK(),l:L('сегодня','today')};
  else if(/(недел|week)/.test(n))range={a:dk(addD(T,-6)),b:todayK(),l:L('7 дней','7 days')};
  else if(/(месяц|month)/.test(n)&&!monthOf(n))range={a:dk(addD(T,-29)),b:todayK(),l:L('30 дней','30 days')};
  else{const m=monthOf(n);if(m!==null){const y=T.getFullYear()-(m>T.getMonth()?1:0);const a=new Date(y,m,1,12),b=new Date(y,m+1,0,12);range={a:dk(a),b:dk(b),l:(EN()?MEN[m]:MRN[m])};}}
  const list=/(покажи|что было|какие записи|show|what happened|entries|history|история)/.test(n)||(range&&!keys.length&&!isHeat);
  say({kind:'answer',q,keys:(keys||[]).slice(0,2),medical:!!medical,isFood,isHeat,range,list});
}
function daySentence(k){
  const l=onDay(k);if(!l.length)return null;
  const syms=[],foods=[];const seen=new Set();
  for(const x of l.slice().reverse()){if(x.kind==='sym'&&!seen.has(x.key)){seen.add(x.key);syms.push(lc(symName(x.key))+(x.s?', '+sName(x.s):'')+((x.ctx||[]).some(c=>c.indexOf('food:')===0)?L(' после еды',' after food'):''));}
    if(x.kind==='food')foods.push(x.items&&x.items.length?x.items.join(', '):mealName(x.meal));}
  const p=[];if(l.some(x=>x.kind==='pause'))p.push(L('Пауза','Pause'));if(syms.length)p.push(cap(syms.join('; ')));if(foods.length)p.push(cap(L('ели: ','ate: ')+foods.join('; ')));
  return p.join('. ');
}
function RangeList({range,f}){
  const list=ST.entries.filter(x=>x.d>=range.a&&x.d<=range.b&&(f==='all'||(f==='sym'?x.kind!=='food':x.kind==='food')));
  const groups=[];let cur=null;for(const x of list){if(!cur||cur.d!==x.d){cur={d:x.d,items:[]};groups.push(cur);}cur.items.push(x);}
  if(!groups.length)return html`<p class="b ink2">${L('За этот период записей нет','No entries for this period')}</p>`;
  const days=new Set(list.map(x=>x.d)).size;
  return html`<p class="c ink2">${range.l}: ${nEnt(list.length)}, ${nDay(days)}</p>
    ${groups.map(g=>html`<div class="col4" key=${g.d}><p class="lbl">${dayHead(g.d)}</p><div class="rows">${g.items.map(x=>html`<${FeedRow} key=${x.id} x=${x}/>`)}</div></div>`)}`;
}

      ${x.text?html`<p class="b">${x.text}</p>`:null}${x.list?html`<ul class="b" style="margin:0;padding-left:20px">${x.list.map(q=>html`<li>${q}</li>`)}</ul>`:null}</div>`)}
    ${ST.allergies.length?html`<div class="col4"><p class="lbl">${L('аллергии и непереносимость','allergies and intolerance')}</p><p class="b">${ST.allergies.join(', ')}</p></div>`:null}
    ${ST.protocols.length||ST.protocol?html`<div class="col4"><p class="lbl">${L('питание','nutrition')}</p><p class="b">${(ST.protocol?[ST.protocol]:[]).concat(ST.protocols).map(p=>p.name+': '+(p.end?fRange(fromDk(p.start),fromDk(p.end)):L('с ','since ')+fDM(fromDk(p.start))+L(', идет',', ongoing'))).join('; ')}</p></div>`:null}
    ${E().some(e=>e.doc)?html`<div class="col4"><p class="lbl">${L('заметки врача','doctor notes')}</p>${E().filter(e=>e.doc).slice(0,3).map(e=>html`<p class="b" key=${e.id}>${fDM(new Date(e.at))}: ${e.words}</p>`)}</div>`:null}
    ${!ST.health?html`<div class="col4"><p class="c ink2">${L('Apple Health не подключен: шагов и сна в сводке нет','Apple Health is not connected: no steps or sleep in the summary')}</p><${ChipGrid} items=${[{l:L('подключить','connect'),fn:()=>cmd(L('подключи Здоровье','connect Health'))}]}/></div>`:null}
    <p class="f ink2">${B?L('Это не медицинское заключение','This is not a medical report'):L('Только факты. Не медицинское заключение','Facts only. Not a medical report')}</p>
    ${seg}
    <button class="btn pri" onClick=${copy}><${I} n="copy"/>${L('скопировать сводку','copy summary')}</button>`;

function DayChart({days}){
  const T=fromDk(todayK());const from=dk(addD(T,-(days-1)));
  const top=topSyms(from,todayK(),3).map(x=>x[0]);if(!top.length)return null;
  const cols=[];let max=1;
  for(let i=days-1;i>=0;i--){const k=dk(addD(T,-i));const c=top.map(t=>symEnts(t).filter(e=>e.d===k).length);const s=c.reduce((a,b)=>a+b,0);max=Math.max(max,s);cols.push({k,c,s});}
  const sh=['var(--ink)','var(--ink3)','var(--control)'];
  return html`<div class="col4"><p class="lbl">${L('записи по дням','entries by day')}</p>
    <div class="dchart" role="img" aria-label=${L('Записи по дням за ','Entries by day for ')+nDay(days)}>${cols.map(c=>html`<div class="dcol" key=${c.k}>${c.c.map((n,i)=>n?html`<i style=${'height:'+(n/max*100)+'%;background:'+sh[i]}></i>`:null)}</div>`)}</div>
    <div class="sx"><span>${cap(fDM(fromDk(from)))}</span><span>${L('сегодня','today')}</span></div>
    <div class="wrap">${top.map((t,i)=>html`<span class="c" key=${t}><i class="sw2" style=${'background:'+sh[i]}></i>${lc(symName(t))} <span class="num">${symEnts(t).filter(e=>e.d>=from).length}</span></span>`)}</div></div>`;
}

function CycleBlock({keys}){

// ---- explicit feedback: no vibration on iPhone web, so the screen does the buzzing ----
// press: instant squeeze under the finger; release: rattle like a motor + ring outside the finger; saves and warnings buzz the whole phone
const hOn=()=>!(ST.comfort&&ST.comfort.haptic===false);
function phoneBuzz(){const p=document.querySelector('.phone');if(!p)return;p.classList.remove('pbuzz');void p.offsetWidth;p.classList.add('pbuzz');p.addEventListener('animationend',()=>p.classList.remove('pbuzz'),{once:true});}
function haptic(kind){if(!hOn())return;const pat=kind==='save'?[40,40,90]:kind==='warn'?[90,60,90]:kind==='undo'?[25,40,25]:[35];try{if(navigator.vibrate)navigator.vibrate(pat);}catch(e){}if(kind==='save'||kind==='warn'||kind==='undo')phoneBuzz();}
const TAPSEL='.chip,.choice,.btn,.li,.fi,.tb,.tx,.mic,.cam,.link,.ib,.sw,.cx,.tr6,.more6';
function ring(el){const r=el.getBoundingClientRect();if(!r.width)return;const d=document.createElement('div');d.className='ring';d.setAttribute('aria-hidden','true');const rad=getComputedStyle(el).borderRadius||'16px';Object.assign(d.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:rad});document.body.appendChild(d);d.addEventListener('animationend',()=>d.remove(),{once:true});setTimeout(()=>d.remove(),900);}
let PRESSED=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest(TAPSEL);if(!el||!hOn())return;PRESSED=el;el.classList.remove('tap');el.classList.add('press');},{passive:true});
function release(e,fire){const el=PRESSED;PRESSED=null;if(!el)return;el.classList.remove('press');if(!fire)return;void el.offsetWidth;el.classList.add('tap');el.addEventListener('animationend',()=>el.classList.remove('tap'),{once:true});ring(el);haptic(el.classList.contains('btn')?'save':'tap');}
document.addEventListener('pointerup',e=>release(e,true),{passive:true});
document.addEventListener('pointercancel',e=>release(e,false),{passive:true});

// ---- figma v5: edit and safety are cards on the one screen, not sheets ----
function openSheet(name,p){if(name==='rec')return say({kind:'edit',id:p.id});if(name==='safety')return say({kind:'safety',v:p.v});return openSheetBase(name,p);}
function closeSheet(){if(UI.resp&&(UI.resp.kind==='edit'||UI.resp.kind==='safety')){UI.resp=null;rr();return;}return closeSheetBase();}
function Frame({title,onBack,children,noClose}){
  if(UI.sheet)return html`<div class="sheet" role="dialog" aria-modal="true" aria-label=${title} tabindex="-1"><div class="handle" aria-hidden="true"></div>${UI.toast&&UI.toast.where==='sheet'?html`<${SheetToast}/>`:null}<div class="shd">${onBack?html`<button class="ib" aria-label=${L('Назад','Back')} onClick=${onBack}><${I} n="chevL"/></button>`:null}<h2 class="t2 grow">${title}</h2>${noClose?null:html`<button class="ib" aria-label=${L('Закрыть','Close')} onClick=${closeSheet}><${I} n="close"/></button>`}</div>${children}</div>`;
  return html`<section class="card surf" aria-label=${title}><div class="row" style="align-items:flex-start">${onBack?html`<button class="ib" aria-label=${L('Назад','Back')} onClick=${onBack}><${I} n="chevL"/></button>`:null}<h2 class="q grow">${title}</h2>${noClose?null:html`<button class="ib" aria-label=${L('К сегодня','Back to today')} onClick=${closeSheet}><${I} n="close"/></button>`}</div>${children}</section>`;}
render(html`<${App}/>`,document.getElementById('app'));
</script></body></html>
