<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ms-app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ms-app design system v1, direction E. Layout: one phone column, fixed bottom bar (log + input + tabs), sheets slide up */
:root{
  --canvas:#F6F6F4;--surface:#FFFFFF;--ink:#1D1D22;--ink2:#5C5C66;--ink3:#62626C;
  --action:#232327;--on-action:#FFFFFF;--border:#232327;
  --t-state:#ECE8FB;--t-memory:#E3F3EA;--t-doctor:#E4EEFB;
  --accent-bg:#FCE6D6;--accent:#8F3D12;--line:#E4E4E0;--line-state:#D9D3F2;
  --toast:#232327;--toast-btn:#3A3A40;--pressed:#EDEDEA;--action-pressed:#3A3A40;--scrim:rgba(18,18,20,.38);--desk:#E9E9E5;
  --font:'Onest',-apple-system,'SF Pro Text',system-ui,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#121214;--surface:#1E1E22;--ink:#F2F2F4;--ink2:#A9A9B3;--ink3:#9C9CA6;--action:#F2F2F4;--on-action:#121214;--border:#F2F2F4;
  --t-state:#2A2540;--t-memory:#1F3329;--t-doctor:#1F2A3B;--accent-bg:#3A2418;--accent:#F2B28C;--line:#2E2E33;--line-state:#3A3452;
  --toast:#F2F2F4;--toast-btn:#D8D8DE;--pressed:#2A2A2F;--action-pressed:#D8D8DE;--scrim:rgba(0,0,0,.55);--desk:#0B0B0C;color-scheme:dark;}}
:root[data-theme="dark"]{
  --canvas:#121214;--surface:#1E1E22;--ink:#F2F2F4;--ink2:#A9A9B3;--ink3:#9C9CA6;--action:#F2F2F4;--on-action:#121214;--border:#F2F2F4;
  --t-state:#2A2540;--t-memory:#1F3329;--t-doctor:#1F2A3B;--accent-bg:#3A2418;--accent:#F2B28C;--line:#2E2E33;--line-state:#3A3452;
  --toast:#F2F2F4;--toast-btn:#D8D8DE;--pressed:#2A2A2F;--action-pressed:#D8D8DE;--scrim:rgba(0,0,0,.55);--desk:#0B0B0C;color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--line-state);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.phone{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--canvas);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){.phone{height:min(900px,calc(100% - 40px));margin-top:20px;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.18)}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;display:flex;flex-direction:column;gap:12px}
.bottom{padding:0 16px calc(env(safe-area-inset-bottom) + 6px);background:var(--canvas);display:flex;flex-direction:column;gap:2px}
/* type scale */
.lt{font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance;margin:0}
.t2{font-weight:600;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
.q{font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.b{font-size:17px;line-height:1.4;margin:0}
.bs{font-weight:600;font-size:17px;line-height:1.4;margin:0}
.c{font-size:15px;line-height:1.35;margin:0}
.cs{font-weight:600;font-size:15px;line-height:1.35;margin:0}
.f{font-size:13px;line-height:1.3;margin:0}
.ink2{color:var(--ink2)}.ink3{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:12px}
.col6{display:flex;flex-direction:column;gap:6px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
/* header */
.hdr{display:flex;align-items:center;gap:8px;padding:0 4px}
.iconbtn{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn.surf{background:var(--surface)}
.iconbtn:active{background:var(--pressed)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{height:62px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day .wd{font-size:12px;line-height:1.2;color:var(--ink2)}
.day .dn{font-weight:600;font-size:17px;line-height:1.2}
.day.today{background:var(--action);color:var(--on-action)}.day.today .wd{color:var(--on-action);opacity:.8}
.day.worse{background:var(--t-state);box-shadow:inset 0 0 0 1.5px var(--ink3)}
/* context tiles */
.tiles3{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.ctile{background:var(--surface);border-radius:18px;padding:10px 12px;min-height:64px;display:flex;flex-direction:column;gap:2px;text-align:left}
.ctile .v{display:flex;align-items:center;gap:6px;font-weight:600;font-size:22px;line-height:1.2}
.ctile .v svg{color:var(--ink2);flex:none}
.ctile .l{font-size:13px;line-height:1.3;color:var(--ink2)}
/* cards */
.card{border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px}
.tone-state{background:var(--t-state)}.tone-memory{background:var(--t-memory)}.tone-doctor{background:var(--t-doctor)}.tone-surface{background:var(--surface)}
.box{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lbl{font-weight:600;font-size:15px;line-height:1.35;color:var(--ink2);margin:0}
/* buttons */
.btn{height:60px;border-radius:999px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:18px;line-height:1.2;width:100%}
.btn.pri{background:var(--action);color:var(--on-action)}.btn.pri:active{background:var(--action-pressed)}
.btn.sec{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--border)}.btn.sec:active{background:var(--pressed)}
.btn.hug{width:auto;min-width:112px;flex:none}
.btns{display:flex;gap:10px}.btns>.btn{flex:1}
.link{height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--ink2);width:100%}
.choice{min-height:58px;border-radius:999px;background:var(--surface);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:17px;line-height:1.2;text-align:center}
.choice:active{background:var(--pressed)}
.choice.sel{box-shadow:inset 0 0 0 2px var(--border)}
.choices{display:flex;gap:8px}.choices>.choice{flex:1;min-width:0;padding:0 10px}
.choicesV{display:flex;flex-direction:column;gap:8px}
.tone-memory .choice,.tone-state .choice,.tone-doctor .choice{background:var(--surface)}
/* chips */
.chip{height:44px;border-radius:22px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-weight:600;font-size:15px}
.chip .x{width:32px;height:32px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-right:-8px;color:var(--ink2)}
.sug{height:44px;border-radius:999px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;padding:0 16px 0 12px;font-weight:600;font-size:15px}
.sug.plain{padding:0 16px}
.sug svg{color:var(--ink2)}
.box .sug,.tone-surface .sug,.list .sug{background:var(--canvas)}
.sug:active,.chip:active{background:var(--pressed)}
.toggle{height:44px;border-radius:999px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;font-weight:600;font-size:15px}
.toggle.on{background:var(--action);color:var(--on-action);padding-left:12px}
.seg{display:flex;gap:8px}.seg>.toggle{flex:1}
/* list rows */
.list{background:var(--surface);border-radius:22px;padding:0 16px}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .rt{color:var(--ink2);font-size:15px}
.li svg{flex:none}
/* switch */
.sw{width:51px;height:31px;border-radius:16px;background:var(--ink3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:var(--on-action);transition:left .2s}
.sw.on{background:var(--action)}.sw.on::after{left:22px}
/* tiles in sheet */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border-radius:22px;padding:14px;min-height:96px;display:flex;flex-direction:column;gap:8px;text-align:left;position:relative}
.tile:active{background:var(--pressed)}
.tile.sel{box-shadow:inset 0 0 0 2px var(--border)}
.tile .star{position:absolute;top:14px;right:14px;color:var(--accent)}
/* feed */
.feed{display:flex;flex-direction:column;gap:8px}
.fi{background:var(--surface);border-radius:22px;padding:12px 14px 12px 12px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.fi.sym{padding:12px 14px}
.fi .ph{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none;background:var(--pressed)}
.fi .ic{width:44px;height:44px;border-radius:22px;background:var(--canvas);display:flex;align-items:center;justify-content:center;flex:none}
.fi .tm{font-size:13px;color:var(--ink2);flex:none}
/* composer */
.actions{display:flex;gap:10px;padding:12px 0 6px}
.comp{flex:none;width:100%;min-width:0;height:60px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--border);display:flex;align-items:center;gap:4px;padding:0 8px}
.comp input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;outline:none;height:44px;padding:0 4px}
.comp input::placeholder{color:var(--ink2)}
.sendbtn{width:44px;height:44px;border-radius:22px;background:var(--action);color:var(--on-action);display:inline-flex;align-items:center;justify-content:center;flex:none}
/* tabbar */
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);padding-top:2px}
.tab{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-weight:500;font-size:12px}
.tab.on{color:var(--ink)}
/* toast */
.toast{background:var(--toast);color:var(--on-action);border-radius:22px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px}
.toast .tb{background:var(--toast-btn);color:var(--on-action);height:40px;border-radius:20px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;flex:none}
/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--canvas);border-radius:28px 28px 0 0;max-height:calc(100% - 44px);overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.handle{width:40px;height:5px;border-radius:3px;background:var(--ink3);opacity:.6;align-self:center;flex:none}
.sheethd{display:flex;align-items:center;gap:8px;padding-left:4px}
.dialog{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:30}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}.sw,.sw::after{transition:none}}
.src{background:var(--t-memory);border-radius:28px;padding:14px 18px;display:flex;gap:12px;align-items:center}
.src img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none}
.ai{display:flex;gap:8px;align-items:flex-start;color:var(--ink2)}
.mark{width:64px;height:64px;border-radius:20px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.progress>div{height:100%;background:var(--action);border-radius:3px}
.badge{background:var(--t-state);box-shadow:inset 0 0 0 1px var(--line-state);border-radius:12px;padding:3px 10px;font-size:13px;flex:none}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mc{aspect-ratio:1/1;max-height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:15px}
.mc.today{background:var(--action);color:var(--on-action)}
.mc.worse{background:var(--t-state);box-shadow:inset 0 0 0 1.5px var(--ink3)}
.mc .bar{width:16px;height:3px;border-radius:2px;background:var(--ink2)}
.mc.today .bar{background:var(--on-action)}
.wdh{font-size:13px;color:var(--ink2);text-align:center}
.big{font-weight:700;font-size:30px;line-height:1.15;margin:0}
.spin{width:28px;height:28px;border-radius:14px;border:3px solid var(--line);border-top-color:var(--action);animation:rot 0.9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.photoBig{width:100%;max-height:300px;object-fit:cover;border-radius:22px;background:var(--pressed)}
.field{height:52px;border-radius:26px;background:var(--surface);border:0;padding:0 18px;font-size:17px;width:100%;outline:none}
.hint{background:var(--toast);color:var(--on-action);border-radius:16px;padding:10px 14px;font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* additions */
.phone{height:100%;height:100dvh}
@media (min-width:600px){.phone{height:min(900px,calc(100dvh - 40px))}}
button:disabled{cursor:default;color:inherit;opacity:1}
.btn:disabled{opacity:.38}
.invis{visibility:hidden}
.top{display:flex;align-items:center;gap:10px;margin-left:-4px}
.hdr .lt{padding:0}
.hdr{padding:0}
.day{border:0;background:none;color:inherit;font:inherit}
.day.fut{opacity:.4}
.dot{width:4px;height:4px;border-radius:2px;background:var(--ink2)}
.day.today .dot{background:var(--on-action)}
.thumb{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.opts{padding:0 0 14px 34px}
.kv{display:flex;flex-direction:column;gap:8px}
.kvr{display:grid;grid-template-columns:minmax(92px,38%) 1fr;gap:10px}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:baseline}
.cmp .num{text-align:right}
.scanbox{background:#0E0E10;color:#fff;border-radius:22px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.toastwrap{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 142px);z-index:40;animation:up .2s ease}
.toastwrap.insheet{top:calc(env(safe-area-inset-top) + 8px);bottom:auto}
.actions .comp{flex:1;width:auto}
.toastwrap.low{bottom:calc(env(safe-area-inset-bottom) + 20px)}
.ob{display:flex;flex-direction:column;height:100%}
.obtop{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 0}
.obbody{flex:1;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:14px}
.obfoot{padding:8px 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:10px}
.sp44{width:44px;height:44px;flex:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;flex:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .toggle{flex:none}
.ctxl{display:flex;align-items:center;gap:8px;color:var(--ink)}
.ctxl svg{color:var(--ink2);flex:none}
.daybox{text-align:left;width:100%}
.cardbtn{text-align:left;width:100%;border:0;color:inherit;font:inherit}
.endpad{height:6px;flex:none}
.divider{height:1px;background:var(--line);margin:4px 0}
.sumbox{gap:8px}
.mc{border:0;background:none;color:inherit;font:inherit;width:100%}
.mc.fut{opacity:.35}
.mc .dt{width:4px;height:4px;border-radius:2px;background:var(--ink2)}
.smallgrid{gap:4px}
.smallgrid .mc{font-size:13px;border-radius:10px;max-height:36px}
.smallgrid .wdh{font-size:11px}
.toggle{border:0;color:inherit;font-family:inherit}
.toggle.big{height:52px;font-size:17px;padding:0 18px}
.toggle.big.on{padding-left:14px}
.chip{border:0;color:inherit;font-family:inherit}
.chip.plainc{color:var(--ink2)}
.box .chip,.box .toggle:not(.on),.box .choice,.list .choice,.tone-surface .choice,.tone-surface .toggle:not(.on),.li .comp{background:var(--canvas)}
.li .comp{box-shadow:none;height:48px}
.li .tt{background:none;border:0;font:inherit;color:inherit;padding:0}
.choice{border:0;color:inherit;font-family:inherit}
.sug{border:0;color:inherit;font-family:inherit;cursor:pointer}
.sug:has(input){position:relative}
.tile{border:0;color:inherit;font-family:inherit}
.fi{border:0;color:inherit;font-family:inherit}
.li{background:none;border-left:0;border-right:0;border-top:0;color:inherit;font-family:inherit}
.li:last-child{border-bottom:0}
.ctile{border:0;color:inherit;font-family:inherit}
label.iconbtn{cursor:pointer}
.src .b{word-break:break-word}
.mark{flex:none}
.lt{word-break:break-word}
.week{flex:none}
.tiles3{flex:none}
.box,.card,.list,.feed{flex:none}
.big{word-break:break-word}
.rt{white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.tab{border:0;background:none;font-family:inherit}
</style>

<div id="app"></div>
<script src="https://unpkg.com/htm@3.1.1/preact/standalone.umd.js"></script>
<script>
// ===== core: i18n, dates, storage, lexicon, simulated context, computations =====
const {html, render, useState, useEffect, useRef} = htmPreact;
const NBSP=' ';
const SHORT=new Set('в во к ко с со о об у и а но да не ни на по за из до от без для при про под над что как или это'.split(' '));
function nb(s){
  if(typeof s!=='string'||s.indexOf(' ')<0) return s;
  const w=s.split(' ');let o='';
  for(let i=0;i<w.length;i++){
    o+=w[i];
    if(i<w.length-1){
      const cur=w[i].toLowerCase().replace(/^[«„"(]+/,'');
      const nx=w[i+1];const nxc=nx.toLowerCase().replace(/[.,!?:;»")]+$/,'');
      const glue=SHORT.has(cur)||nx==='—'||nxc==='же'||nxc==='ли'||nxc==='бы'||(/^\d+([.,]\d+)?$/.test(cur)&&nx&&!/^[\d–—→]/.test(nx));
      o+=glue?NBSP:' ';
    }
  }
  return o;
}
function nbE(s){
  if(typeof s!=='string') return s;
  let r='';for(let i=0;i<s.length;i++){const ch=s[i];if(ch===' '&&i>0&&/[0-9]/.test(s[i-1])&&i+1<s.length&&!/[0-9\s–—→]/.test(s[i+1])) r+=NBSP; else r+=ch;}return r;
}
let LANG='ru';
const L=(ru,en)=>LANG==='en'?nbE(en===undefined?ru:en):nb(ru);
const EN=()=>LANG==='en';
function withLang(lg,fn){const p=LANG;LANG=lg;try{return fn();}finally{LANG=p;}}
function plRu(n,a,b,c){const x=Math.abs(n)%100,y=x%10;if(x>10&&x<20)return c;if(y>1&&y<5)return b;if(y===1)return a;return c;}
const nEnt=n=>EN()?`${n} ${n===1?'entry':'entries'}`:`${n} ${plRu(n,'запись','записи','записей')}`;
const nDay=n=>EN()?`${n} ${n===1?'day':'days'}`:`${n} ${plRu(n,'день','дня','дней')}`;
const nQ=n=>EN()?`${n} ${n===1?'question':'questions'}`:`${n} ${plRu(n,'вопрос','вопроса','вопросов')}`;
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const qt=s=>LANG==='en'?'“'+s+'”':'«'+s+'»';
const lc=s=>s?s[0].toLowerCase()+s.slice(1):s;
const esc=s=>String(s==null?'':s);

// ---- dates (app clock can be shifted for testing) ----

function symsIn(t){
  const n=norm(t);const out=[];
  for(const [k,re] of LEX){const m=n.match(re);if(m&&!out.find(o=>o.k===k)){if(k==='weak'&&out.find(o=>o.k==='legs'))continue;if(k==='pain'&&out.find(o=>o.k==='headache'))continue;out.push({k,i:m.index});}}

function parseCtx(t){

      else if(s&&last&&!last.s)last.s=s;}
    for(const k of keys)if(!items.find(i=>i.key===k))items.push({key:k,s:null,ctx:ctx.slice()});
    return {kind:'sym',items,when};
  }
  return {kind:'unknown'};
}

function hsh(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}

function topSyms(from,to,limit){const c={};for(const e of symEnts())if(e.d>=from&&e.d<=to)c[e.key]=(c[e.key]||0)+1;return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,limit||3);}
function heatCount(k,from,to){const l=symEnts(k).filter(e=>e.d>=from&&e.d<=to);return {n:l.length,h:l.filter(e=>(e.ctx||[]).some(c=>HEAT.includes(c))||isHot(new Date(e.at))).length};}
function coincidences(){
  const end=fromDk(todayK());const days=[];for(let i=29;i>=0;i--)days.push(dk(addD(end,-i)));const d0=days[0];
  const foodDays=new Set(E().filter(e=>e.kind==='food'&&e.d>=d0).map(e=>e.d));
  if(foodDays.size<7)return {few:true,n:foodDays.size};
  const symDay=new Set(E().filter(e=>e.kind==='sym'&&e.d>=d0).map(e=>e.d));
  const hit=d=>symDay.has(d)||symDay.has(dk(addD(fromDk(d),1)));
  const res=[];
  for(const g of Object.keys(GROUPS)){
    const gD=days.filter(d=>E().some(e=>e.kind==='food'&&e.d===d&&(e.items||[]).some(it=>inGroup(it,g))));
    if(gD.length<3)continue;
    const after=gD.filter(hit);const oth=[...foodDays].filter(d=>!gD.includes(d));const othA=oth.filter(hit);
    res.push({g,n:gD.length,a:after.length,o:oth.length,oa:othA.length,days:after,hot:after.filter(d=>isHot(fromDk(d))).length,sl:ST.health?after.filter(d=>sleepFor(fromDk(d))<6).length:null,pre:periodStarts().length?after.filter(prePeriod).length:null});
  }
  res.sort((x,y)=>(y.a/y.n-y.oa/Math.max(1,y.o))-(x.a/x.n-x.oa/Math.max(1,x.o)));
  return {few:false,res,n:foodDays.size};
}

const checkOver=()=>ST.check&&todayK()>checkEndK(ST.check);
const checkDayN=()=>ST.check?ddiff(now(),fromDk(ST.check.start))+1:0;
function checkResult(c){
  const s=fromDk(c.start),e=addD(s,c.days-1),b0=addD(s,-c.days),b1=addD(s,-1);
  const rng=(a,b)=>{const out=[];for(let d=new Date(a);d<=b;d=addD(d,1))out.push(dk(d));return out;};
  const D=rng(s,e),B=rng(b0,b1);

  const worse=ds=>ds.filter(k=>inWorse(k)||symEnts().some(x=>x.d===k&&x.s===3)).length;

  if(strong&&!ST.worse&&strong.d===todayK())UP(n=>{n.worsePrompt={key:strong.key,id:strong.id,d:strong.d};});
  const pd=prev?new Date(prev.at):null;const pdd=pd?ddiff(now(),pd):0;const msg=items.length>1?L('Записано: ','Logged: ')+nEnt(items.length):prev?L('Записано. В прошлый раз ','Logged. Last time: ')+(pdd===0?L('сегодня в ','today at ')+fT(pd):pdd===1?L('вчера','yesterday'):fDM(pd)):L('Записано','Logged');
  toast(msg,()=>removeEntries(ents.map(e=>e.id)));
  return ents;
}

function submitText(t,mode,photo){
  if(photo){photoFlow(photo,t);return;}
  if(!t)return;
  if(SAFETY.test(norm(t))){openSheet('safety',{text:t,mode});return;}
  if(mode==='doctor'){addQuestion(t);return;}
  if(mode==='decided'){UP(s=>{s.visit.notes.push({id:uid(),text:cap(t),at:now().toISOString()});});toast(L('Записано в решения приема','Saved to visit decisions'));return;}
  route(t,mode);
}
function route(t,mode){
  if(ST.ai==='off'){if(mode==='history'){openSheet('query',{q:t,res:plainSearch(t)});return;}openSheet('dict',{text:t});return;}
  const r=analyzeRest(t);
  if(mode==='history'&&r.kind!=='medical'&&r.kind!=='doctorq'){openSheet('query',{q:t,res:answerQuery(t,symsIn(t))});return;}
  if(r.kind==='doctorq'){addQuestion(r.q);return;}
  if(r.kind==='medical'){openSheet('medical',{q:t,keys:r.keys});return;}
  if(r.kind==='query'){openSheet('query',{q:t,res:answerQuery(t,r.keys)});return;}
  if(r.kind==='med'){openSheet('medLog',{text:t});return;}
  if(r.kind==='food'){openSheet('food',{text:t,items:r.items,meal:r.meal||mealByTime(r.when||now()),feel:r.feel,at:r.when?r.when.toISOString():null});return;}
  if(r.kind==='sym'){openSheet('parse',{text:t,items:r.items,at:r.when?r.when.toISOString():null});return;}
  openSheet('unknown',{text:t});
}
function photoFlow(photo,caption){
  const items=caption?foodItems(caption):[];const feel=caption?symsIn(caption):[];
  const meal=mealIn(caption||'')||mealByTime(now());

function answerQuery(t,keys){
  const n=norm(t);
  const dayW=/позавчера/.test(n)?2:/(вчера|yesterday)/.test(n)?1:/(сегодня|today)/.test(n)?0:null;
  const foodQ=/(еда|еду|еды|съел|(^|\s)ел[аи]?(\s|$)|food|(^|\s)eat|(^|\s)ate(\s|$)|meal)/.test(n);
  if(foodQ&&dayW!==null){const k=dk(addD(now(),-dayW));const list=E().filter(e=>e.kind==='food'&&e.d===k);return {found:list.length>0,text:list.length?cap(dayTitle(fromDk(k)))+': '+list.map(e=>mealName(e.meal)+', '+entryTitle(e)).join('; '):L('Записей еды за этот день нет','No food entries for that day'),list};}
  if(keys&&keys.length){const k=keys[0];const all=symEnts(k);if(!all.length)return {found:false,text:L('В записях такого нет','Nothing like this in your entries'),list:[],key:k};
    const monthK=dk(addD(now(),-29));const month=all.filter(e=>e.d>=monthK);
    if(/(сколько|как часто|how many|how often)/.test(n)){const wk=/(недел|week)/.test(n);const fk=dk(addD(now(),wk?-6:-29));const c=all.filter(e=>e.d>=fk);return {found:true,text:(wk?L('За 7 дней: ','Last 7 days: '):L('За 30 дней: ','Last 30 days: '))+nEnt(c.length),list:c,key:k};}
    const last=all[0];const q=[];if(last.s)q.push(sName(last.s));if(last.words)q.push(qt(last.words));else for(const c of (last.ctx||[]))q.push(ctxText(c));
    return {found:true,text:cap(rel(new Date(last.at)))+'. '+(q.length?cap(q.join(', '))+'. ':'')+L('За месяц ','This month: ')+nEnt(month.length),list:month.length?month:[last],key:k};}
  const fw=toks(t).filter(isFoodTok).filter(x=>!/^(завтрак|обед|ужин|перекус|breakfast|lunch|dinner|snack)/.test(x));
  if(fw.length){const st=fw[0].slice(0,Math.max(4,fw[0].length-2));const list=E().filter(e=>e.kind==='food'&&(e.items||[]).some(i=>norm(i).indexOf(st)>=0));if(list.length)return {found:true,text:L('Последний раз ','Last time: ')+relDT(new Date(list[0].at))+'. '+L('За месяц ','This month: ')+nEnt(list.filter(e=>e.d>=dk(addD(now(),-29))).length),list:list.slice(0,12)};}
  return plainSearch(t);
}
function plainSearch(t){
  const stop=/^(когда|сколько|последний|последнее|раз|покажи|найди|найти|было|ли|что|как|часто|меня|мне|был|была|the|when|last|time|show|find|how|many|did|was|my|me)$/;
  const ws=toks(t).filter(w=>w.length>=3&&!stop.test(w));
  if(!ws.length)return {found:false,text:L('В записях ответа не нашла','Couldn’t find an answer in your entries'),list:[]};
  const hit=e=>{const s=norm([entryTitle(e),entrySub(e),e.words||'',(e.items||[]).join(' ')].join(' '));return ws.some(w=>s.indexOf(w.slice(0,Math.max(3,w.length-2)))>=0);};
  const list=E().filter(hit).slice(0,20);
  return {found:list.length>0,text:list.length?L('Нашла в записях: ','Found in entries: ')+nEnt(list.length):L('В записях ответа не нашла','Couldn’t find an answer in your entries'),list};
}

}

function fillSample(){
  const t=now();let sd=11;const rnd=()=>{sd=(sd*16807)%2147483647;return (sd-1)/2147483646;};const pick=a=>a[Math.floor(rnd()*a.length)];

  const add=(e,d)=>{if(d>t)return;ents.push(Object.assign({id:uid()},e,{at:d.toISOString(),d:dk(d)}));};

  const B=[[T('овсянка','oatmeal'),T('банан','banana'),T('кофе с молоком','coffee with milk')],[T('йогурт греческий 2%','greek yogurt 2%'),T('кофе с молоком','coffee with milk')],[T('омлет','omelet'),T('хлеб','bread'),T('чай','tea')],[T('сырники','cottage cheese pancakes'),T('кофе','coffee')]];

  const Di=[[T('паста','pasta'),T('салат','salad')],[T('курица','chicken'),T('овощи','vegetables')],[T('хинкали','khinkali')]];
  const W1=[38,33],W2=[80,78];const inW=i=>(i<=W1[0]&&i>=W1[1])||(i<=W2[0]&&i>=W2[1]);
  for(let i=90;i>=1;i--){
    add({kind:'med',name:med1,src:'health'},at(i,9,0));add({kind:'med',name:med1,src:'health'},at(i,21,0));
    if(i<=32&&rnd()<0.85)add({kind:'food',meal:'breakfast',items:pick(B).slice(),src:'text'},at(i,8,20+Math.floor(rnd()*30)));
    if(i<=32&&rnd()<0.6)add({kind:'food',meal:'lunch',items:pick(Lu).slice(),src:'text'},at(i,13,Math.floor(rnd()*40)));
    if(i<=32&&rnd()<0.3)add({kind:'food',meal:'dinner',items:pick(Di).slice(),src:'text'},at(i,19,Math.floor(rnd()*40)));
    if(rnd()<0.25)add({kind:'move',what:'walk',min:20+Math.floor(rnd()*4)*5,src:'health'},at(i,18,10));
    if(inW(i)){add({kind:'sym',key:'numb',s:3,ctx:[],via:'tap'},at(i,10,15));if(rnd()<0.7)add({kind:'sym',key:'fatigue',s:pick([2,3]),ctx:[],via:'tap'},at(i,19,30));continue;}
    if(rnd()<0.13){const hs=rnd()<0.6;add({kind:'sym',key:'numb',s:pick([1,2,2]),ctx:hs?['shower']:[],via:hs?'text':'tap',words:hs?T('опять онемели пальцы после душа','fingers went numb again after a shower'):null,cool:hs&&i>3?pick(['yes','yes','unsure']):undefined},at(i,8+Math.floor(rnd()*3),Math.floor(rnd()*50)));}
    if(rnd()<0.1)add({kind:'sym',key:'fatigue',s:pick([1,2]),ctx:[],via:'tap'},at(i,20,Math.floor(rnd()*50)));
    if(rnd()<0.05)add({kind:'sym',key:'fog',s:1,ctx:[],via:'tap'},at(i,16,20));

  }
  add({kind:'sym',key:'numb',s:2,ctx:[],via:'text',words:T('немеют кончики','fingertips going numb')},at(8,11,40));
  add({kind:'sym',key:'fog',s:1,ctx:[],via:'tap'},at(1,21,10));
  if(t.getHours()>=9)add({kind:'med',name:med1,src:'health'},at(0,9,0));
  const tk=dk(t);const dd=n=>dk(addD(t,n));
  UP(n=>{
    n.entries=n.entries.filter(e=>e.d===tk&&!(e.kind==='med'&&e.src==='health')).concat(ents).sort((a,b)=>b.at<a.at?-1:1);
    n.health=true;n.cycle='health';n.cyclePaused=false;n.seed=dd(-25);if(!n.city&&!n.geo)n.city=T('Тбилиси','Tbilisi');

    n.worseHist=[{start:dd(-W1[0]),end:dd(-W1[1]),did:['visit','iv','rest'],key:'numb'},{start:dd(-W2[0]),end:dd(-W2[1]),did:['rest'],key:'numb'}];n.worse=null;n.worsePrompt=null;

    n.visit={date:dd(12),noDate:false,notes:[],done:false};n.firstDay=dd(-90);n.dismiss={};

  else {const res=norm(q.trim())?CITIES.filter(c=>norm(c[0]).indexOf(norm(q.trim()))===0||norm(c[1]).indexOf(norm(q.trim()))===0):CITIES.slice(0,4);
    body=html`<${Mark} ic="sun"/><h1 class="lt">${L('погода','weather')}</h1><p class="b">${L('Погода записывается сама. Нужна геопозиция или ваш город','Weather is logged automatically. I need your location or city')}</p>
      ${cityOpen?html`<${Field} ph=${L('город','city')} value=${q} onChange=${setQ} auto=${true}/><div class="list">${res.map(c=>html`<${Row} t=${L(c[0],c[1])} s=${L(c[2],c[3])} onClick=${()=>finish({city:L(c[0],c[1]),geo:false})}/>`)}${q.trim()&&!res.length?html`<${Row} icon="plus" t=${cap(q.trim())} s=${L('свой город','your city')} onClick=${()=>finish({city:cap(q.trim()),geo:false})}/>`:null}</div>`:null}`;
    foot=cityOpen?null:html`<${Btn} onClick=${()=>finish({geo:true})}>${L('разрешить геопозицию','allow location')}</${Btn}><${Btn} k="sec" onClick=${()=>setCityOpen(true)}>${L('указать город','enter city')}</${Btn}><${Lnk} onClick=${()=>finish({})}>${L('не сейчас','not now')}</${Lnk}>`;}
  return html`<div class="ob"><${Hd}/><div class="obbody" key=${step}>${body}</div>${foot?html`<div class="obfoot">${foot}</div>`:null}</div>`;
}

// ---- root ----
function TabBar(){const T=[['today','today','сегодня','today'],['history','cal','период','history'],['doctor','doc','к врачу','doctor']];
  return html`<nav class="tabbar" aria-label=${L('разделы','sections')}>${T.map(t=>html`<button class=${'tab'+(UI.tab===t[0]?' on':'')} aria-current=${UI.tab===t[0]?'page':null} onClick=${()=>setTab(t[0])}>${I(t[1],24)}<span>${L(t[2],t[3])}</span></button>`)}</nav>`;}
function Toast({low}){
  const t=UI.toast;
  useEffect(()=>{if(!t)return;const h=setTimeout(()=>ui(u=>(u.toast&&u.toast.id===t.id)?{toast:null}:{}),t.undo?10000:4500);return ()=>clearTimeout(h);},[t&&t.id]);
  if(!t)return null;
  return html`<div class=${'toastwrap'+(UI.sheet?' insheet':low?' low':'')} role="status" aria-live="polite"><div class="toast"><p class="c grow">${t.text}</p>${t.undo?html`<button class="tb" onClick=${()=>{t.undo();ui({toast:null});}}>${I('undo',16)}${L('отменить','undo')}</button>`:null}</div></div>`;
}
function SheetHost(){const s=UI.sheet;const C=SH[s.name];if(!C)return null;return html`<${C} key=${s.k} p=${s}/>`;}
function Phone(){
  const scRef=useRef();
  const top=UI.stack[UI.stack.length-1];const scr=top?SCR[top.name]:null;
  const skey=top?top.name+':'+(top.k||top.lg||'')+':'+UI.stack.length:UI.tab;
  useEffect(()=>{if(scRef.current)scRef.current.scrollTop=0;},[skey]);
  if(!ST.onboarded)return html`<div class="phone">${html`<${Onboarding}/>`}<${Toast} low=${true}/>${UI.sheet?html`<${SheetHost}/>`:null}</div>`;
  const vi=visitInfo();const decided=UI.tab==='doctor'&&vi.past&&vi.dd>=-14;
  const mode=UI.tab==='today'?'today':UI.tab==='history'?'history':decided?'decided':'doctor';
  const ph=mode==='today'?L('как вы?','how are you?'):mode==='history'?L('найти в записях','search entries'):mode==='decided'?L('что решили?','what was decided?'):L('вопрос врачу','ask the doctor');
  const showActions=!top;const showTabs=(!top||scr.tab)&&!UI.focus;
  const Tab=UI.tab==='today'?Today:UI.tab==='history'?History:Doctor;
  return html`<div class="phone">
    <main class="scroll" ref=${scRef} key=${skey}>${top?html`<${scr.c} ...${top}/>`:html`<${Tab}/>`}<div class="endpad"></div></main>
    ${showActions||showTabs?html`<div class="bottom">${showActions?html`<div class="actions">${UI.focus||UI.comp||UI.photo?null:html`<${Btn} hug icon="plus" onClick=${()=>openSheet('record')}>${L('записать','log')}</${Btn}>`}<${Composer} ph=${ph} camera=${mode==='today'} mode=${mode} key=${mode}/></div>`:null}${showTabs?html`<${TabBar}/>`:null}</div>`:null}
    <${Toast} low=${!showActions}/>
    ${UI.sheet?html`<${SheetHost}/>`:null}
  </div>`;
}
const HOST_THEME=document.documentElement.getAttribute('data-theme');
function App(){
  const [st,setSt]=useState(loadS);
  const [u,setU]=useState({tab:'today',stack:[],sheet:null,toast:null,comp:'',photo:null,focus:false,ob:0,focusReq:0,hist:{mode:'week',count:7,mOff:0,layers:{heat:true,cycle:true,food:false,walk:false,sleep:false,meds:false}}});
  ST=st;UI=u;SUI=setU;LANG=st.lang;
  UP=fn=>setSt(prev=>{const n=JSON.parse(JSON.stringify(prev));fn(n);if(!saveS(n))setTimeout(()=>toast(L('Не хватает места, фото может не сохраниться','Out of space, the photo may not be saved')),0);return n;});
  useEffect(()=>{const r=document.documentElement;if(st.theme==='system'){if(HOST_THEME)r.setAttribute('data-theme',HOST_THEME);else r.removeAttribute('data-theme');}else r.setAttribute('data-theme',st.theme);r.setAttribute('lang',st.lang);},[st.theme,st.lang]);
  const [,force]=useState(0);useEffect(()=>{const t=setInterval(()=>force(x=>x+1),30000);return ()=>clearInterval(t);},[]);
  return html`<${Phone}/>`;
}
render(html`<${App}/>`,document.getElementById('app'));
</script>
</body>
</html>
